<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ciclista em Código</title>
<style>
 :root{--bg:#0f1720;--fg:#f2f2f2;--btn:#22303f;--btn2:#f4c20d;--borda:#000}
 @media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#eef2f6;--fg:#111;--btn:#ffffff;--btn2:#f4c20d}}
 :root[data-theme="dark"]{--bg:#0f1720;--fg:#f2f2f2;--btn:#22303f}
 *{box-sizing:border-box}
 body{margin:0;background:var(--bg);color:var(--fg);font:600 14px system-ui,sans-serif}
 #palco{display:block;width:100%;max-width:1280px;margin:0 auto;aspect-ratio:16/9;background:#7cc0ea}
 #ctl{max-width:1280px;margin:0 auto;padding:10px 16px 24px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
 .g{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
 .g b{opacity:.7;font-size:12px;letter-spacing:.05em;text-transform:uppercase;margin-right:2px}
 button{background:var(--btn);color:var(--fg);border:2px solid #000;border-radius:10px;padding:8px 12px;font:inherit;cursor:pointer}
 button.on{background:var(--btn2);color:#111}
 input[type=range]{width:160px}
 input[type=color]{width:34px;height:30px;border:2px solid #000;border-radius:6px;padding:0;background:none}
 label{display:flex;flex-direction:column;align-items:center;font-size:11px;opacity:.85}
 #rpmv{min-width:64px;display:inline-block}
</style>
</head>
<body>
<canvas id="palco" width="1280" height="720"></canvas>
<div id="ctl">
 <div class="g"><b>Pose</b><button data-pose="sentado" class="on">Sentado</button><button data-pose="pe">Em pé</button><button data-pose="sprint">Sprint</button></div>
 <div class="g"><b>Cadência</b><input id="rpm" type="range" min="0" max="130" value="80"><span id="rpmv">80 rpm</span></div>
 <div class="g"><b>Tamanho</b><input id="zoom" type="range" min="0.5" max="2.2" step="0.05" value="1.5"></div>
 <div class="g"><b>Kit</b><span id="kits"></span><button id="aleat">Aleatório</button></div>
 <div class="g" id="cores"></div>
</div>
<script>
// =====================================================================================================
// CICLISTA EM CÓDIGO (teste). Tudo em Canvas 2D, sem imagens. Unidades locais: raio da roda = 60,
// origem no eixo traseiro, y para baixo, indo para a direita. API: cicDesenhar(ctx,x,y,escala,estado).
// =====================================================================================================
const CIC={
 R:60, eixoD:[184,0], mov:[80,6], piv:23,            // roda, eixo dianteiro, movimento central, pedivela
 coxa:80, canela:73, braco:60, antebraco:57,
 ol:2.6,                                             // contorno
 poses:{
  sentado:{quad:[36,-126], omb:[112,-190], mao:[186,-108], gota:0, cab:0,   quad_b:1.2, omb_b:1.2, omb_x:0},
  pe:     {quad:[74,-136], omb:[150,-172], mao:[186,-108], gota:0, cab:-4,  quad_b:5,   omb_b:3.5, omb_x:3},
  sprint: {quad:[84,-130], omb:[162,-150], mao:[193,-78],  gota:1, cab:-9 , quad_b:7,   omb_b:5,   omb_x:6}
 }
};
const KITS={
 branco: {camisa:'#f3f3f3',bermuda:'#ededed',capacete:'#f6f6f6',quadro:'#f1f1f1',sapatilha:'#f6f6f6',luva:'#2a2a2a',pele:'#e0a172',barba:'#6a4630',meia:'#ffffff'},
 azul:   {camisa:'#2f6fd6',bermuda:'#1b2230',capacete:'#ffffff',quadro:'#1f3f80',sapatilha:'#ffffff',luva:'#1b1b1b',pele:'#c98a5e',barba:'#3b2618',meia:'#ffffff'},
 vinho:  {camisa:'#9a2238',bermuda:'#1b1b1b',capacete:'#f0c419',quadro:'#5e1220',sapatilha:'#1b1b1b',luva:'#1b1b1b',pele:'#f0bf98',barba:'#8a5a2b',meia:'#1b1b1b'},
 verde:  {camisa:'#2f9a46',bermuda:'#1c1c1c',capacete:'#3fbf55',quadro:'#232323',sapatilha:'#ffffff',luva:'#1b1b1b',pele:'#8d5a3a',barba:'#1e140e',meia:'#ffffff'},
 amarelo:{camisa:'#f4c20d',bermuda:'#1a1a1a',capacete:'#222222',quadro:'#c62828',sapatilha:'#f4c20d',luva:'#1b1b1b',pele:'#e8b08a',barba:'#4a2e1c',meia:'#f4c20d'}
};

// ---------- cor ----------
function hx(c){c=c.replace('#','');return[parseInt(c.slice(0,2),16),parseInt(c.slice(2,4),16),parseInt(c.slice(4,6),16)]}
function rgb(a){return'rgb('+a.map(v=>Math.max(0,Math.min(255,Math.round(v)))).join(',')+')'}
function tom(c,k){const a=hx(c);return rgb(a.map(v=>v*k))}                      // k<1 escurece
function mist(c,d,t){const a=hx(c),b=hx(d);return rgb(a.map((v,i)=>v+(b[i]-v)*t))}
// sombra "fria" (puxa para azul) como na referência
function somb(c){return mist(c,'#1c2340',.32)}
function tras(c){return mist(c,'#141a2e',.42)}
function sombR(c){return mist(c,'#26304f',.36)}                                // sombra da roupa (mais forte: kit branco não some no quadro)                                // membros de trás

// ---------- geometria ----------
const add=(a,b)=>[a[0]+b[0],a[1]+b[1]], sub=(a,b)=>[a[0]-b[0],a[1]-b[1]], mul=(a,k)=>[a[0]*k,a[1]*k];
const len=a=>Math.hypot(a[0],a[1]), lerp=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];
const rot=(a,r)=>[a[0]*Math.cos(r)-a[1]*Math.sin(r),a[0]*Math.sin(r)+a[1]*Math.cos(r)];
const LUZ=(()=>{const l=[-.45,-.9],n=len(l);return[l[0]/n,l[1]/n]})();
// IK de dois ossos: devolve as duas soluções; quem chama escolhe
function ik(A,B,l1,l2){
 const d0=sub(B,A);let d=len(d0);d=Math.max(Math.abs(l1-l2)+.01,Math.min(l1+l2-.01,d));
 const a=Math.atan2(d0[1],d0[0]),al=Math.acos((l1*l1+d*d-l2*l2)/(2*l1*d));
 return[add(A,[Math.cos(a+al)*l1,Math.sin(a+al)*l1]),add(A,[Math.cos(a-al)*l1,Math.sin(a-al)*l1])];
}

// ---------- formas ----------
// "Osso com carne": círculos nas juntas + quadriláteros entre eles. Junta redonda = sem emenda.
function seg(c,p,q,r1,r2){
 const u=sub(q,p),L=len(u)||1,n=[-u[1]/L,u[0]/L];
 c.beginPath();c.moveTo(p[0]+n[0]*r1,p[1]+n[1]*r1);c.lineTo(q[0]+n[0]*r2,q[1]+n[1]*r2);
 c.lineTo(q[0]-n[0]*r2,q[1]-n[1]*r2);c.lineTo(p[0]-n[0]*r1,p[1]-n[1]*r1);c.closePath();c.fill();
}
function bola(c,p,r){c.beginPath();c.arc(p[0],p[1],Math.max(.1,r),0,Math.PI*2);c.fill()}
function carne(c,pts,rs,cresce){
 for(let i=0;i<pts.length;i++)bola(c,pts[i],rs[i]+cresce);
 for(let i=0;i<pts.length-1;i++)seg(c,pts[i],pts[i+1],rs[i]+cresce,rs[i+1]+cresce);
}
// pinta com 2 tons: tudo no tom de sombra, depois o tom claro um pouco menor e deslocado para a luz
function carne2(c,pts,rs,cor,corS){
 c.fillStyle=corS;carne(c,pts,rs,0);
 const p2=pts.map((p,i)=>{
  const a=pts[Math.max(0,i-1)],b=pts[Math.min(pts.length-1,i+1)],u=sub(b,a),L=len(u)||1,n=[-u[1]/L,u[0]/L];
  const k=(n[0]*LUZ[0]+n[1]*LUZ[1])*rs[i]*.3;return add(p,mul(n,k));
 });
 c.fillStyle=cor;carne(c,p2,rs.map(r=>r*.74),0);
}
// caminho suave fechado passando pelos pontos médios
function suave(c,pts){
 const n=pts.length;c.beginPath();
 const m=(i)=>lerp(pts[i%n],pts[(i+1)%n],.5);
 let s=m(n-1);c.moveTo(s[0],s[1]);
 for(let i=0;i<n;i++){const e=m(i);c.quadraticCurveTo(pts[i][0],pts[i][1],e[0],e[1])}
 c.closePath();
}
function traco(c,cor,w,pts,fecha){c.strokeStyle=cor;c.lineWidth=w;c.beginPath();c.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)c.lineTo(pts[i][0],pts[i][1]);if(fecha)c.closePath();c.stroke()}

// ---------- bike ----------
function bkGeo(){
 return{
  mov:CIC.mov, sel:[48,-80], topoTs:[38,-112], cxD:[136,-88], cxB:[146,-60],
  mesa:[160,-96], guid:[170,-97], ponta:[178,-99], capuz:[186,-106], pontaM:[192,-114],
  gota:[[178,-99],[196,-96],[201,-82],[195,-71],[185,-70]],
  selim:[[16,-118],[58,-117]]
 };
}
function roda(c,ctr,R,ang,ol,lado){
 const [x,y]=ctr;
 // pneu
 c.lineWidth=5.5+ol*2;c.strokeStyle='#000';c.beginPath();c.arc(x,y,R-2.75,0,7);c.stroke();
 c.lineWidth=5.5;c.strokeStyle='#34343a';c.beginPath();c.arc(x,y,R-2.75,0,7);c.stroke();
 // aro (perfil)
 c.lineWidth=5;c.strokeStyle='#17181c';c.beginPath();c.arc(x,y,R-8.5,0,7);c.stroke();
 c.lineWidth=ol*.8;c.strokeStyle='#000';c.beginPath();c.arc(x,y,R-11,0,7);c.stroke();
 // brilho do pneu (luz de cima)
 c.lineWidth=2;c.strokeStyle='rgba(255,255,255,.18)';c.beginPath();c.arc(x,y,R-4,Math.PI*1.08,Math.PI*1.62);c.stroke();
 // marcas de giro (como na referência)
 c.lineWidth=1.4;c.strokeStyle='rgba(200,205,215,.55)';
 for(let i=0;i<5;i++){const a=ang+i*1.2566;c.beginPath();c.arc(x,y,R-8.5,a,a+.42);c.stroke();
  c.beginPath();c.arc(x,y,R-17,a+.6,a+.85);c.stroke()}
 // cubo
 c.fillStyle='#000';bola(c,ctr,6.2);c.fillStyle='#55585e';bola(c,ctr,4.2);c.fillStyle='#9aa0a8';bola(c,ctr,1.6);
 // disco de freio
 c.lineWidth=ol*.8;c.strokeStyle='#000';c.fillStyle='rgba(60,64,70,.55)';c.beginPath();c.arc(x,y,13,0,7);c.fill();c.stroke();
 c.fillStyle='#000';bola(c,ctr,6.2);c.fillStyle='#6a6e75';bola(c,ctr,4.4);
}
function quadro(c,cor,ol){
 const g=bkGeo(),[ax,ay]=[0,0],f=CIC.eixoD,cs=somb(cor);
 const tubos=[ // [a,b,raio]
  [g.sel,g.cxD,4.4],[g.cxB,g.mov,6.2],[g.mov,g.sel,4.8],[g.mov,[ax,ay],3.2],[g.sel,[ax,ay],2.6],[g.cxD,g.cxB,5.6],
  [g.cxB,lerp(g.cxB,f,.5),4.4],[lerp(g.cxB,f,.5),f,3]
 ];
 c.fillStyle='#000';for(const t of tubos){seg(c,t[0],t[1],t[2]+ol,t[2]+ol);bola(c,t[0],t[2]+ol);bola(c,t[1],t[2]+ol)}
 c.fillStyle=cs;for(const t of tubos){seg(c,t[0],t[1],t[2],t[2]);bola(c,t[0],t[2]);bola(c,t[1],t[2])}
 // luz em cima dos tubos
 c.fillStyle=cor;for(const t of tubos){const u=sub(t[1],t[0]),L=len(u),n=[-u[1]/L,u[0]/L],s=(n[0]*LUZ[0]+n[1]*LUZ[1])>0?1:-1,o=mul(n,s*t[2]*.32);
  seg(c,add(t[0],o),add(t[1],o),t[2]*.66,t[2]*.66);bola(c,add(t[0],o),t[2]*.66);bola(c,add(t[1],o),t[2]*.66)}
 // reflexo fino
 c.strokeStyle='rgba(255,255,255,.55)';c.lineWidth=1.3;c.lineCap='round';
 traco(c,'rgba(255,255,255,.5)',1.3,[lerp(g.sel,g.cxD,.15),lerp(g.sel,g.cxD,.8)].map(p=>add(p,[0,-2.2])));
 traco(c,'rgba(255,255,255,.4)',1.3,[lerp(g.cxB,g.mov,.15),lerp(g.cxB,g.mov,.7)].map(p=>add(p,[-2.6,-2.4])));
}
function selimEpeca(c,ol){
 const g=bkGeo();
 // canote
 c.fillStyle='#000';seg(c,g.sel,g.topoTs,3+ol,3+ol);c.fillStyle='#2a2b30';seg(c,g.sel,g.topoTs,3,3);
 // selim
 const s=[[12,-119],[20,-124],[44,-121],[60,-119],[58,-115],[40,-114],[22,-113],[13,-114]];
 suave(c,s);c.fillStyle='#1d1e22';c.fill();c.lineWidth=ol;c.strokeStyle='#000';c.stroke();
 traco(c,'rgba(255,255,255,.25)',1.4,[[20,-121.5],[42,-119.5]]);
}
function guidao(c,ol,cor){
 const g=bkGeo();
 // mesa
 c.fillStyle='#000';seg(c,g.cxD,g.mesa,3.4+ol,3.4+ol);bola(c,g.mesa,3.4+ol);
 c.fillStyle='#24252a';seg(c,g.cxD,g.mesa,3.4,3.4);bola(c,g.mesa,3.4);
 // curva (fita preta)
 const cv=g.gota;c.lineCap='round';c.lineJoin='round';
 c.strokeStyle='#000';c.lineWidth=6.4+ol*2;c.beginPath();c.moveTo(g.mesa[0],g.mesa[1]);c.lineTo(cv[0][0],cv[0][1]);
 c.bezierCurveTo(cv[1][0],cv[1][1],cv[2][0],cv[2][1],cv[3][0],cv[3][1]);c.lineTo(cv[4][0],cv[4][1]);c.stroke();
 c.strokeStyle='#1f2024';c.lineWidth=6.4;c.stroke();
 // manete: capuz + alavanca
 const cap=[[176,-102],[183,-110],[191,-117],[195,-113],[193,-104],[188,-97],[180,-96]];
 suave(c,cap);c.fillStyle='#202126';c.fill();c.lineWidth=ol;c.strokeStyle='#000';c.stroke();
 c.strokeStyle='#000';c.lineWidth=4+ol*2;c.beginPath();c.moveTo(191,-104);c.quadraticCurveTo(199,-92,197,-78);c.stroke();
 c.strokeStyle='#33353b';c.lineWidth=4;c.stroke();
}
function transmissao(c,ol,ang,ladoPerto){
 const m=CIC.mov;
 // corrente
 c.lineCap='round';
 traco(c,'#000',3.4,[[m[0],m[1]-17],[0,-8]]);traco(c,'#000',3.4,[[m[0],m[1]+17],[0,8]]);
 traco(c,'#6d7179',1.6,[[m[0],m[1]-17],[0,-8]]);traco(c,'#6d7179',1.6,[[m[0],m[1]+17],[0,8]]);
 // cassete
 c.fillStyle='#000';bola(c,[0,0],10.5);c.fillStyle='#8b9099';bola(c,[0,0],8.6);
 c.strokeStyle='#4b4f56';c.lineWidth=1;for(const r of[7,5.4,3.8]){c.beginPath();c.arc(0,0,r,0,7);c.stroke()}
 // câmbio traseiro
 c.fillStyle='#000';seg(c,[-2,4],[4,18],3.6+ol,3+ol);c.fillStyle='#2c2d32';seg(c,[-2,4],[4,18],3.6,3);
 c.fillStyle='#000';bola(c,[4,18],3.6+ol);c.fillStyle='#55585f';bola(c,[4,18],3.4);
 // coroa (com dentes)
 c.fillStyle='#000';bola(c,m,19.5+ol*.6);
 c.fillStyle='#2b2c31';bola(c,m,19.2);
 c.strokeStyle='#5b5f66';c.lineWidth=1.6;c.setLineDash([2.2,2.4]);c.lineDashOffset=-ang*20;c.beginPath();c.arc(m[0],m[1],18.2,0,7);c.stroke();c.setLineDash([]);
 c.fillStyle='#1a1b1f';bola(c,m,13);
 c.strokeStyle='#42454b';c.lineWidth=2.4;
 for(let i=0;i<4;i++){const a=ang+i*Math.PI/2+.4;c.beginPath();c.moveTo(m[0],m[1]);c.lineTo(m[0]+Math.cos(a)*12,m[1]+Math.sin(a)*12);c.stroke()}
}
function pedivela(c,ol,ang,escuro){
 const m=CIC.mov,p=add(m,[Math.cos(ang)*CIC.piv,Math.sin(ang)*CIC.piv]);
 c.fillStyle='#000';seg(c,m,p,4.2+ol,3.2+ol);bola(c,m,5+ol);bola(c,p,3.2+ol);
 c.fillStyle=escuro?'#1c1d22':'#34363c';seg(c,m,p,4.2,3.2);bola(c,m,5);bola(c,p,3.2);
 if(!escuro){c.fillStyle='#8a8f97';bola(c,m,2)}
 return p;
}
function pedal(c,p,ol,escuro){
 c.save();c.translate(p[0],p[1]);
 c.fillStyle='#000';c.fillRect(-7-ol,-2-ol,14+ol*2,4+ol*2);c.fillStyle=escuro?'#202125':'#3a3c42';c.fillRect(-7,-2,14,4);c.restore();
}

// ---------- corpo ----------
// pé no referencial do pé (x para a frente). Pedal (taquinho) em (0,0).
const PE={tornoz:[-13,-11], forma:[[-25,-3],[-24,-11],[-15,-17],[-6,-14],[6,-8],[16,-4],[20,1],[16,4],[-4,5],[-22,4]]};
function angPe(a){return .16+.2*Math.sin(a)+.06*Math.cos(a)}          // tornozelo: ponta desce no empurrão
function sapatilha(c,ped,ang,cor,meia,ol,escuro){
 const r=angPe(ang);
 c.save();c.translate(ped[0],ped[1]);c.rotate(r);
 const cs=escuro?tras(cor):cor,css=escuro?tras(somb(cor)):somb(cor);
 suave(c,PE.forma);c.fillStyle=css;c.fill();
 c.save();c.clip();c.translate(-1.5,-2.4);suave(c,PE.forma);c.fillStyle=cs;c.fill();c.restore();
 suave(c,PE.forma);c.lineWidth=ol;c.strokeStyle='#000';c.stroke();
 // sola, fivela e detalhe
 c.lineCap='round';traco(c,'#000',2.2,[[-21,3.6],[16,3.2]]);
 traco(c,escuro?'#111':'#2b2b2b',2,[[-8,-11],[2,-6]]);
 traco(c,escuro?'#111':'#2b2b2b',1.6,[[-3,-12.5],[6,-7.5]]);
 c.restore();
}
function tornozelo(ped,ang){return add(ped,rot(PE.tornoz,angPe(ang)))}
function perna(c,quad,ped,ang,K,ol,escuro){
 const tz=tornozelo(ped,ang);
 const ks=ik(quad,tz,CIC.coxa,CIC.canela),jo=(ks[0][0]-ks[0][1])>(ks[1][0]-ks[1][1])?ks[0]:ks[1];
 // panturrilha: atrás da canela
 const u=sub(tz,jo),L=len(u),n=[-u[1]/L,u[0]/L],ns=(n[0]<0?1:-1);
 const pant=add(lerp(jo,tz,.3),mul(n,ns*4.2)),pant2=add(lerp(jo,tz,.62),mul(n,ns*1.2));
 const uq=mul(sub(jo,quad),1/len(sub(jo,quad))),nq=rot(uq,-Math.PI/2);   // nq = em cima da coxa
 const coxaM=add(lerp(quad,jo,.45),mul(nq,1.8)),vasto=add(lerp(quad,jo,.8),mul(nq,1.4));
 const pts=[quad,coxaM,vasto,jo,pant,pant2,tz],rs=[15.5,15,12.4,9,11.6,7.6,5.2];
 const pele=escuro?tras(K.pele):K.pele,peleS=escuro?tras(somb(K.pele)):somb(K.pele);
 const bm=escuro?tras(K.bermuda):K.bermuda,bmS=escuro?tras(sombR(K.bermuda)):sombR(K.bermuda);
 const barra=lerp(quad,jo,.58);
 // contorno de tudo junto (sem emenda)
 c.fillStyle='#000';carne(c,pts,rs,ol);carne(c,[quad,coxaM,barra],[15.9,15.4,13.6],ol);
 carne2(c,pts,rs,pele,peleS);
 // meia
 const meia=escuro?tras(K.meia):K.meia;c.fillStyle='#000';carne(c,[lerp(jo,tz,.78),tz],[6.6,6],ol*.6);
 c.fillStyle=meia;carne(c,[lerp(jo,tz,.78),tz],[6.6,6],0);
 // bermuda
 carne2(c,[quad,coxaM,barra],[15.9,15.4,13.6],bm,bmS);
 const ub=sub(barra,quad),Lb=len(ub),nb=[-ub[1]/Lb,ub[0]/Lb];
 c.lineCap='round';traco(c,'#000',ol,[add(barra,mul(nb,14.4)),add(barra,mul(nb,-14.4))]);
 // joelho (dobra) — risco curto
 if(!escuro){ // joelho: patela com brilho + vinco atrás
  const pt=add(jo,mul(nq,4.5));c.strokeStyle='rgba(0,0,0,.55)';c.lineWidth=1.3;c.beginPath();c.arc(pt[0],pt[1],5.2,Math.atan2(uq[1],uq[0])-2.4,Math.atan2(uq[1],uq[0])-.6);c.stroke();
  c.fillStyle='rgba(255,255,255,.22)';bola(c,add(pt,[-1,-1.5]),2.6);
  const vk=add(jo,mul(nq,-6.5));traco(c,'rgba(0,0,0,.4)',1.2,[add(vk,mul(uq,-3)),add(vk,mul(u,4/L))]);
  // linha da panturrilha
  const pc=add(lerp(jo,tz,.42),mul(n,ns*3.5));traco(c,'rgba(0,0,0,.28)',1.2,[pc,add(pc,mul(u,9/L))]);}
 sapatilha(c,ped,ang,K.sapatilha,K.meia,ol,escuro);
}
function braco(c,omb,mao,K,ol,escuro){
 const es=ik(omb,mao,CIC.braco,CIC.antebraco);
 const co=(es[0][1]-es[0][0]*.4)>(es[1][1]-es[1][0]*.4)?es[0]:es[1];
 const pts=[omb,co,mao],rs=[10.5,7.4,6];
 const pele=escuro?tras(K.pele):K.pele,peleS=escuro?tras(somb(K.pele)):somb(K.pele);
 const cm=escuro?tras(K.camisa):K.camisa,cmS=escuro?tras(sombR(K.camisa)):sombR(K.camisa);
 const manga=lerp(omb,co,.5);
 c.fillStyle='#000';carne(c,pts,rs,ol);carne(c,[omb,manga],[13.5,10.5],ol);
 // bíceps/antebraço com volume
 carne2(c,[omb,lerp(omb,co,.6),co,lerp(co,mao,.35),mao],[10.5,9,7.4,7.6,6],pele,peleS);
 carne2(c,[omb,manga],[13.5,10.5],cm,cmS);
 const u=sub(manga,omb),L=len(u),n=[-u[1]/L,u[0]/L];
 c.lineCap='round';traco(c,'#000',ol,[add(manga,mul(n,11.1)),add(manga,mul(n,-11.1))]);
 // luva fechada na manete
 const lv=escuro?'#0e0f12':K.luva;
 const lc=add(mao,[1.5,1.5]);c.save();c.translate(lc[0],lc[1]);c.rotate(-.75);
 c.fillStyle='#000';c.beginPath();c.ellipse(0,0,10+ol,7+ol,0,0,7);c.fill();c.fillStyle=lv;c.beginPath();c.ellipse(0,0,10,7,0,0,7);c.fill();
 c.fillStyle=escuro?'#181a20':mist(K.luva,'#ffffff',.2);c.beginPath();c.ellipse(-1.5,-2.5,6,3.2,0,0,7);c.fill();c.restore();
 // dedos
 if(!escuro){c.strokeStyle='#000';c.lineWidth=1.1;for(let i=0;i<3;i++){c.beginPath();c.arc(mao[0]+2+i*2.3,mao[1]+2,3.2,-.3,1.6);c.stroke()}}
 return co;
}
function tronco(c,quad,omb,K,ol){
 const u=sub(omb,quad),L=len(u),uu=mul(u,1/L);let n=[-uu[1],uu[0]];if(n[1]>0)n=mul(n,-1);   // n = lado das costas (para cima)
 const P=(t,w)=>add(add(quad,mul(u,t)),mul(n,w));
 const forma=[P(-.06,-17),P(-.2,-2),P(-.12,14),P(.1,18),P(.38,21),P(.66,25.5),P(.9,23.5),P(1.08,14),P(1.14,2),P(1.06,-9),P(.92,-15),P(.55,-16),P(.2,-19)];
 const sm=(cor)=>sombR(cor);
 c.save();suave(c,forma);c.clip();
 c.fillStyle=sm(K.bermuda);c.fillRect(-500,-500,1000,1000);
 c.save();c.translate(n[0]*7,n[1]*7);suave(c,forma);c.fillStyle=K.bermuda;c.fill();c.restore();
 // camisa acima da cintura (linha inclinada)
 const cin=t=>[P(t,-40),P(t+.07,40)];const a=cin(.24);
 c.beginPath();c.moveTo(a[0][0],a[0][1]);c.lineTo(a[1][0],a[1][1]);const fim=P(1.6,0);
 c.lineTo(add(a[1],mul(u,2))[0],add(a[1],mul(u,2))[1]);c.lineTo(add(a[0],mul(u,2))[0],add(a[0],mul(u,2))[1]);c.closePath();c.save();c.clip();
 c.fillStyle=sm(K.camisa);c.fillRect(-500,-500,1000,1000);
 c.save();c.translate(n[0]*8-uu[0]*2,n[1]*8-uu[1]*2);suave(c,forma);c.fillStyle=K.camisa;c.fill();c.restore();
 // dobras da camisa
 c.strokeStyle=somb(sm(K.camisa));c.lineWidth=1.3;c.lineCap='round';
 for(const t of[.42,.6]){const p=P(t,-12),q=P(t+.1,-3);c.beginPath();c.moveTo(p[0],p[1]);c.quadraticCurveTo(P(t+.02,-6)[0],P(t+.02,-6)[1],q[0],q[1]);c.stroke()}
 c.restore();
 c.restore();
 // contorno + cintura
 suave(c,forma);c.lineWidth=ol;c.strokeStyle='#000';c.lineJoin='round';c.stroke();
 const w1=P(.24,19.5),w2=P(.31,-17.5);c.lineCap='round';
 c.beginPath();c.moveTo(w1[0],w1[1]);c.quadraticCurveTo(P(.27,2)[0]+uu[0]*2,P(.27,2)[1]+uu[1]*2,w2[0],w2[1]);c.stroke();
 return{n,u:uu};
}
function cabeca(c,omb,quad,tilt,K,ol){
 const u=sub(omb,quad),uu=mul(u,1/len(u));
 const pesc=add(omb,add(mul(uu,6),[3,-2]));
 const C=add(omb,[28,-31]),HS=1.69;  // centro e escala da cabeça
 // pescoço
 c.fillStyle='#000';carne(c,[pesc,add(C,[-7,14])],[10,10],ol);
 carne2(c,[pesc,add(C,[-7,14])],[10,10],K.pele,somb(K.pele));
 c.save();c.translate(C[0],C[1]);c.rotate(tilt*Math.PI/180);c.scale(HS,HS);ol/=HS;
 // rosto (perfil)
 const rosto=[[-13,6],[-15,-4],[-8,-14],[6,-14],[14,-8],[15.2,-3.5],[15.2,-3.5],[16,-.5],[21.5,5.5],[21.5,5.5],[17.5,7.2],[17.5,7.2],[17.2,9.5],[16,11.2],[17.8,14.6],[17.8,14.6],[15.6,17.6],[8,18],[-3,15]];
 suave(c,rosto);c.fillStyle=somb(K.pele);c.fill();
 c.save();suave(c,rosto);c.clip();c.translate(1.6,-2);suave(c,rosto);c.fillStyle=K.pele;c.fill();
 // barba
 const barba=[[-1,3],[4,8],[11,9.5],[16.2,11],[18.2,14.8],[15.8,18.2],[8,19],[-3,16],[-6,8]];
 suave(c,barba);c.fillStyle=K.barba;c.fill();
 c.fillStyle='rgba(0,0,0,.18)';suave(c,[[0,10],[8,16],[14,14],[8,19],[-2,16]]);c.fill();
 c.restore();
 suave(c,rosto);c.lineWidth=ol;c.strokeStyle='#000';c.stroke();
 // bigode e boca
 c.lineCap='round';traco(c,K.barba,2.4,[[12.5,7.8],[17,8.4]]);traco(c,'#000',1,[[14,10.6],[16.6,10.4]]);
 traco(c,'rgba(0,0,0,.45)',.9,[[17.5,4],[15.8,6.4]]);
 // orelha
 c.save();c.translate(-1,3);c.fillStyle=somb(K.pele);c.beginPath();c.ellipse(0,0,3,4.2,.2,0,7);c.fill();c.lineWidth=ol*.6;c.strokeStyle='rgba(0,0,0,.7)';c.stroke();
 c.strokeStyle='rgba(0,0,0,.3)';c.lineWidth=1;c.beginPath();c.arc(.3,0,1.8,-1.2,1.4);c.stroke();c.restore();
 // capacete
 const cap=[[-19,1],[-18,-9],[-11,-18],[0,-22],[11,-19],[19,-11],[22,-5],[17,-4],[8,-7],[-2,-5],[-12,-1]];
 suave(c,cap);c.fillStyle=somb(K.capacete);c.fill();
 c.save();suave(c,cap);c.clip();c.translate(-1,-3);suave(c,cap);c.fillStyle=K.capacete;c.fill();
 // faixa clara de brilho
 c.strokeStyle='rgba(255,255,255,.45)';c.lineWidth=2;c.beginPath();c.arc(-1,-4,15,-2.5,-1.4);c.stroke();
 c.restore();
 suave(c,cap);c.lineWidth=ol;c.strokeStyle='#000';c.stroke();
 // entradas de ar
 c.fillStyle='#111';
 for(const v of[[[-14,-8],[-9,-15],[-6,-13],[-11,-7]],[[-5,-13],[1,-18],[4,-16],[-2,-11]],[[5,-15],[11,-17],[12,-14],[7,-12]],[[13,-12],[18,-11],[18,-8],[14,-9]]]){
  c.beginPath();c.moveTo(v[0][0],v[0][1]);for(const p of v.slice(1))c.lineTo(p[0],p[1]);c.closePath();c.fill()}
 // alça
 traco(c,'#111',1.6,[[-6,-2],[2,6],[5,13]]);
 // óculos
 traco(c,'#111',2.2,[[-3,-3.5],[6,-4.5]]);
 const lente=[[5,-5.5],[13,-7],[19.5,-5],[19,-0.5],[13,1],[6.5,-.5]];
 suave(c,lente);c.fillStyle='#1b1d24';c.fill();c.lineWidth=ol*.9;c.strokeStyle='#000';c.stroke();
 c.save();suave(c,lente);c.clip();c.fillStyle='rgba(120,170,255,.5)';c.beginPath();c.moveTo(9,-8);c.lineTo(14,-8);c.lineTo(10,2);c.lineTo(6,2);c.fill();c.restore();
 c.restore();
}

// ---------- montagem ----------
// estado: {ang (pedivela, rad), roda (rad), pose:{...}, cores, t}
function cicDesenhar(c,x,y,esc,E){
 const K=E.cores,P=E.pose,ol=CIC.ol,a=E.ang,R=CIC.R;
 c.save();c.translate(x,y);c.scale(esc,esc);c.translate(0,-R);   // y = chão
 c.lineJoin='round';c.lineCap='round';
 // balanço: o quadril desce no empurrão (2× por volta), anda para a frente/atrás
 const bob=Math.cos(2*a);
 const quad=add(P.quad,[Math.sin(a)*P.omb_x*.5,bob*P.quad_b]);
 const omb=add(P.omb,[Math.sin(a)*P.omb_x,bob*P.omb_b*.6+Math.sin(2*a+.6)*.6]);
 const mao=P.mao;
 const ped1=add(CIC.mov,[Math.cos(a)*CIC.piv,Math.sin(a)*CIC.piv]),ped2=add(CIC.mov,[Math.cos(a+Math.PI)*CIC.piv,Math.sin(a+Math.PI)*CIC.piv]);
 // sombra no chão
 c.fillStyle='rgba(0,0,0,.22)';c.beginPath();c.ellipse(92,R+1,135,6,0,0,7);c.fill();
 // 1) rodas
 roda(c,[0,0],R,E.roda,ol);roda(c,CIC.eixoD,R,E.roda,ol);
 // 2) lado de trás: pedivela, perna e braço escuros
 pedivela(c,ol,a+Math.PI,true);pedal(c,ped2,ol,true);
 perna(c,quad,ped2,a+Math.PI,K,ol,true);
 braco(c,add(omb,[-3,-2]),add(mao,[-4,-1]),K,ol,true);
 // 3) bike
 quadro(c,K.quadro,ol);selimEpeca(c,ol);guidao(c,ol,K.quadro);
 transmissao(c,ol,a,true);
 // 4) corpo da frente
 tronco(c,quad,omb,K,ol);
 const pd1=pedivela(c,ol,a,false);
 pedal(c,ped1,ol,false);
 perna(c,quad,ped1,a,K,ol,false);
 cabeca(c,omb,quad,P.cab,K,ol);
 braco(c,omb,mao,K,ol,false);
 c.restore();
}
window.CIC=CIC;window.cicDesenhar=cicDesenhar;

const cv=document.getElementById('palco'),ctx=cv.getContext('2d');
const IMG={};
function carregar(n){const i=new Image();i.onerror=()=>{if(!i._b){i._b=1;i.src='img/'+n+'.webp'}};i.src='../src/assets/imagens/'+n+'.webp';IMG[n]=i}
['cen_ceu','cen_campo','cen_veg','asph'].forEach(carregar);
const ok=i=>i&&i.complete&&i.naturalWidth>0;
const S={pose:'sentado',rpm:80,zoom:1.5,ang:0,roda:0,scroll:0,cores:{...KITS.branco},kit:'branco'};
const poseAtual=JSON.parse(JSON.stringify(CIC.poses.sentado));
function tira(img,x0,y,h,par){const w=img.naturalWidth*h/img.naturalHeight;let x=-((S.scroll*par)%w);for(;x<1280;x+=w-1)ctx.drawImage(img,x,y,w,h)}
function fundo(){
 if(ok(IMG.cen_ceu))ctx.drawImage(IMG.cen_ceu,0,0,1280,430);else{const g=ctx.createLinearGradient(0,0,0,430);g.addColorStop(0,'#3d9be0');g.addColorStop(1,'#bfe6ff');ctx.fillStyle=g;ctx.fillRect(0,0,1280,430)}
 ctx.fillStyle='#6fae3a';ctx.fillRect(0,380,1280,340);
 if(ok(IMG.cen_campo))tira(IMG.cen_campo,0,200,300,.25);
 // estrada
 if(ok(IMG.asph))tira(IMG.asph,0,486,180,1);else{ctx.fillStyle='#4f4f58';ctx.fillRect(0,500,1280,150)}
 if(ok(IMG.cen_veg))tira(IMG.cen_veg,0,600,150,1.35);
}
const CHAO=592;
let ult=performance.now();
function passo(dt){
 const alvo=CIC.poses[S.pose],k=1-Math.exp(-dt/.18);
 for(const key in alvo){const v=alvo[key];if(Array.isArray(v)){poseAtual[key][0]+=(v[0]-poseAtual[key][0])*k;poseAtual[key][1]+=(v[1]-poseAtual[key][1])*k}else poseAtual[key]+=(v-poseAtual[key])*k}
 const w=S.rpm/60*Math.PI*2;S.ang+=w*dt;
 const marcha=S.pose==='sprint'?53/12:S.pose==='pe'?50/15:50/17;          // só para a velocidade de tela
 const vms=S.rpm/60*marcha*2.1;S.vms=vms;
 S.roda+=vms/.335*dt;S.scroll+=vms*dt*(CIC.R*S.zoom/.335);
}
function desenhar(){
 fundo();
 const esc=S.zoom*.9,x=640-92*esc;
 cicDesenhar(ctx,x,CHAO,esc,{ang:S.ang,roda:S.roda,pose:poseAtual,cores:S.cores});
 ctx.font='800 22px system-ui';ctx.fillStyle='#fff';ctx.strokeStyle='#000';ctx.lineWidth=5;ctx.lineJoin='round';
 const txt=S.rpm+' rpm · '+Math.round(S.vms*3.6)+' km/h · '+({sentado:'sentado',pe:'em pé',sprint:'sprint'})[S.pose];
 ctx.strokeText(txt,24,40);ctx.fillText(txt,24,40);
}
function loop(t){const dt=Math.min(.05,(t-ult)/1000);ult=t;passo(dt);desenhar();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
window.TESTE={S,passo,desenhar,poseAtual};

// controles
document.querySelectorAll('[data-pose]').forEach(b=>b.onclick=()=>{S.pose=b.dataset.pose;document.querySelectorAll('[data-pose]').forEach(x=>x.classList.toggle('on',x===b))});
const rpm=document.getElementById('rpm');rpm.oninput=()=>{S.rpm=+rpm.value;document.getElementById('rpmv').textContent=S.rpm+' rpm'};
const zm=document.getElementById('zoom');zm.oninput=()=>{S.zoom=+zm.value};
const kd=document.getElementById('kits');
const NOMES={camisa:'camisa',bermuda:'bermuda',capacete:'capacete',quadro:'quadro',sapatilha:'sapatilha',luva:'luva',pele:'pele',meia:'meia'};
function pintarInputs(){document.querySelectorAll('#cores input').forEach(i=>i.value=S.cores[i.dataset.k])}
for(const k in KITS){const b=document.createElement('button');b.textContent=k;b.onclick=()=>{S.cores={...KITS[k]};pintarInputs();kd.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b))};if(k==='branco')b.classList.add('on');kd.appendChild(b)}
const cd=document.getElementById('cores');
for(const k in NOMES){const l=document.createElement('label');const i=document.createElement('input');i.type='color';i.dataset.k=k;i.value=S.cores[k];i.oninput=()=>{S.cores[k]=i.value};l.appendChild(i);l.appendChild(document.createTextNode(NOMES[k]));cd.appendChild(l)}
document.getElementById('aleat').onclick=()=>{
 const r=()=>'#'+[0,0,0].map(()=>Math.floor(Math.random()*256).toString(16).padStart(2,'0')).join('');
 const peles=['#f0bf98','#e0a172','#c98a5e','#8d5a3a','#5e3a24'];
 S.cores={...S.cores,camisa:r(),bermuda:Math.random()<.6?'#1b1b1b':r(),capacete:r(),quadro:r(),sapatilha:Math.random()<.5?'#f6f6f6':r(),pele:peles[Math.floor(Math.random()*5)]};
 pintarInputs();kd.querySelectorAll('button').forEach(x=>x.classList.remove('on'));
};
