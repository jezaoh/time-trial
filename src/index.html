<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#06121c"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Time Trial V2</title>
<link rel="stylesheet" href="css/style.css">
</head><body>
<!-- tela de carregamento (17/11): HTML puro no topo, aparece enquanto o resto do arquivo (~15 MB) ainda baixa -->
<div id="carga" style="position:fixed;inset:0;z-index:20;background:#06121c;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;font-family:system-ui,sans-serif;font-style:italic">
<div style="color:#ffd23a;font-weight:900;font-size:min(13vw,96px);letter-spacing:2px">TIME TRIAL</div>
<div style="width:min(70vw,620px);height:22px;border-radius:11px;background:#1c3550;overflow:hidden"><div id="cargaBarra" style="height:100%;width:30%;border-radius:11px;background:#ffd23a;animation:cargaVai 1.1s ease-in-out infinite alternate"></div></div>
<div id="cargaTxt" style="color:#fff;font-weight:800;font-size:min(5vw,26px)">CARREGANDO…</div>
<style>@keyframes cargaVai{from{margin-left:0}to{margin-left:70%}}</style></div>
<!--CSS-->
<div id="rot">Gire o celular para jogar na horizontal</div>
<div id="stage"><canvas id="game" width="1536" height="864"></canvas>
<input id="nick" maxlength="8" placeholder="Digite seu nick..." autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Seu nickname">
<button id="water" aria-label="Beber água"></button><button id="gel" aria-label="Tomar gel"></button><button id="bolt" aria-label="Acelerar"></button></div>
