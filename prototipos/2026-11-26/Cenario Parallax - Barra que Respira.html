<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cenário Parallax</title>
<style>
/* Cenário parallax (estilo Alto's) + Barra que Respira + HUD em pílulas */
:root{--acc:#f5c518;--pill:rgba(28,38,52,.78);--fg:#f4f6f8;--dim:#b8c2cc;color-scheme:dark}
html,body{height:100%;margin:0;background:#0b1020;color:var(--fg);overflow:hidden;
 font:14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
.bt{background:#1c2634;color:var(--fg);border:1px solid #3a4658;border-radius:10px;
 padding:10px 14px;font:700 13px system-ui,sans-serif;letter-spacing:.05em;cursor:pointer}
.bt:focus-visible{outline:2px solid var(--acc)}
#pausa{position:fixed;inset:0;background:rgba(8,12,22,.55);display:flex;align-items:center;justify-content:center}
#pausa[hidden],#painel[hidden],#build[hidden]{display:none}
#pausa .box{background:#141c28f2;border:1px solid #33404f;border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:10px;min-width:220px}
#pausa h2{margin:0 0 6px;font:italic 800 20px system-ui,sans-serif;letter-spacing:.04em;text-align:center}
#pausa p{margin:0 0 6px;text-align:center;color:var(--dim)}
#painel,#build{position:fixed;top:0;bottom:0;width:min(340px,92vw);background:#0b0f18f2;
 padding:calc(12px + env(safe-area-inset-top,0px)) 14px 16px;overflow-y:auto;box-sizing:border-box;display:flex;flex-direction:column;gap:12px}
#painel{right:0;border-left:1px solid #2c3644}
#build{left:0;border-right:1px solid #2c3644}
#painel h2,#build h2{margin:0;font-size:15px;letter-spacing:.06em}
#painel h3{margin:6px 0 0;font-size:12px;letter-spacing:.08em;color:var(--dim)}
#sl,#slb{display:flex;flex-direction:column;gap:12px}
#resumo{color:var(--acc);font-weight:600;line-height:1.5}
.lin{display:grid;grid-template-columns:1fr auto;gap:2px 8px}
.lin label{font-weight:600}
.lin output{color:var(--acc)}
.lin input{grid-column:1/-1;width:100%;accent-color:var(--acc)}
.lin small{grid-column:1/-1;color:var(--dim);line-height:1.3}
.acoes{display:flex;gap:8px;flex-wrap:wrap}
#texto{width:100%;box-sizing:border-box;background:#000;color:var(--fg);border:1px solid #333;border-radius:6px;font:12px ui-monospace,monospace;padding:6px}
#ver{color:var(--dim);font-size:11px}
</style></head><body>

<canvas id="cv"></canvas>

<div id="pausa" hidden><div class="box">
 <h2 id="pTit">PAUSA</h2><p id="pSub"></p>
 <button class="bt" id="continuar" type="button">CONTINUAR</button>
 <button class="bt" id="reini" type="button">REINICIAR</button>
 <button class="bt" id="abrir" type="button">AJUSTES</button>
 <button class="bt" id="abrirB" type="button">BUILD</button>
 <button class="bt" id="cheia" type="button">TELA CHEIA</button>
</div></div>

<aside id="build" hidden>
 <h2>BUILD</h2><div id="slb"></div><div id="resumo"></div>
 <div class="acoes"><button class="bt" id="fecharB" type="button">FECHAR</button></div>
</aside>
<aside id="painel" hidden>
 <h2>AJUSTES</h2><div id="sl"></div>
 <div class="acoes">
  <button class="bt" id="copiar" type="button">COPIAR NÚMEROS</button>
  <button class="bt" id="padrao" type="button">VOLTAR AO PADRÃO</button>
  <button class="bt" id="fechar" type="button">FECHAR</button>
 </div>
 <textarea id="texto" rows="4" readonly aria-label="Números atuais"></textarea>
 <div id="ver"></div>
</aside>

<script>
const VERSAO='27/11/2026 12:29 subida: qualquer watt anda';
// ---------------------------------------------------------------------------------------------
// Números ajustáveis
const PADRAO={ftp:208,toque:5,morde:12,come:6,tauIn:.06,volta:.1,dureza:2,vazio:3,
 fadH:80,fadExp:4.2,fadAcima:5.8,tetoVazio:85,escuro:10,
 sprintApos:1.5,sprMin:25,sprCheia:5,sprMeio:3,sprPicoMeio:60,sprCusto:50,sprVolta:15,
 empeLiga:115,empeSai:100,
 ts:40,dist:9,zoomV:.12,empurra:1.5,tremor:.3,vento:1,
 vis:23,tam:.4,faixa:.3,larg:22,incl:1,dia:4,neblina:1,
 nvSprint:2,nvFolego:3,nvRec:3,nvEsc:2,
 aguaQ:5,aguaFad:8,aguaSeg:2,isoQ:5,isoFad:9,isoSta:12,bananaQ:2,bananaFad:6,bananaSta:40,gelQ:2,gelFrac:40,
 som:1,musica:.5,efeitos:.8};
const P=Object.assign({},PADRAO);
const SLB=[
 ['ftp','Motor: FTP (W)',120,400,1,'Sua força de 1 hora. Tudo é medido em % dela.'],
 ['nvSprint','Sprint (nível)',0,10,1,'Pico = 700 + 40 W por nível.'],
 ['nvFolego','Resistência (nível)',0,10,1,'Fadiga do tempo −8% por nível (composto: nível 10 ≈ aguenta 2,3× mais). No sprint, −2% por nível.'],
 ['nvRec','Recuperação (nível)',0,10,1,'A barra volta +6% mais rápido por nível.'],
 ['nvEsc','Escalada (nível)',0,10,1,'−1 kg por nível (75 kg no nível 0).']];
const SL=[
 ['BARRA'],
 ['toque','Mordida do toque (%)',0,20,.5,'Pedaço que some na hora que o dedo encosta.'],
 ['morde','Mordida pela força (%)',0,40,.5,'Pedaço extra conforme os watts.'],
 ['come','Come segurando (%/s)',0,30,.5,'Enquanto segura, a barra continua sendo comida.'],
 ['tauIn','Velocidade da mordida (s)',.02,.4,.01,'Menor = some mais rápido.'],
 ['volta','Velocidade da volta (s)',.05,2,.05,'Menor = volta mais rápido quando solta.'],
 ['dureza','Dureza no final',0,6,.1,'Com a barra baixa a mordida cresce e a volta demora.'],
 ['vazio','Castigo de segurar vazio (/s)',0,15,.5,'Segurando com o verde zerado, o vermelho avança isso por segundo.'],
 ['escuro','Tela escurece abaixo de (%)',0,40,1,'Só quando o verde fica menor que isso da barra inteira.'],
 ['FADIGA (vermelho que não volta)'],
 ['fadH','Fadiga por hora de prova no FTP',20,300,1,'Conta em tempo de PROVA. 80 (Resistência 3) ≈ quem segura o FTP quebra perto do km 30 (~1:30 de jogo).'],
 ['fadExp','Curva abaixo do FTP',1,8,.1,'Maior = pedalar leve cansa bem menos (90% do FTP ≈ 0,9^curva da fadiga do FTP).'],
 ['fadAcima','Castigo acima do FTP',0,20,.1,'Fadiga acima do FTP: ×(1 + isto·(excesso)^1,5). 5,8 = 2× o FTP torra a barra em ~11 s.'],
 ['tetoVazio','Teto com o verde vazio (% FTP)',50,100,1,'Sem verde não passa disso.'],
 ['SPRINT'],
 ['sprintApos','Sprint liga depois de (s)',.4,3,.1,'Segurando mais que isso o sprint liga. Soltou, tem que segurar tudo de novo.'],
 ['sprMin','Sprint precisa de stamina (%)',0,80,1,'Abaixo desse tanto de amarelo (no momento em que você aperta) não sai sprint.'],
 ['sprCheia','Sprint com barra cheia (s)',1,12,.5,'Duração no pico com a barra 100%.'],
 ['sprMeio','Sprint com meia barra (s)',1,10,.5,'Duração com a barra em 50% (e abaixo).'],
 ['sprPicoMeio','Pico com meia barra (%)',20,100,1,'Quanto do pico (acima do FTP) sai com meia barra. Barra cheia = 100%.'],
 ['sprCusto','Parte do sprint que vira fadiga (%)',0,100,1,'Do amarelo que o sprint gasta, essa parte vira vermelho para sempre (água/gel devolvem).'],
 ['sprVolta','Volta da stamina depois do sprint (s)',.1,60,.5,'O resto do que o sprint gastou volta até o vermelho nesse tempo (devagar). 0,1 = na hora. Isotônico/banana aceleram. A respiração dos toques não muda.'],
 ['CICLISTA EM PÉ'],
 ['empeLiga','Fica em pé acima de (% FTP)',90,200,1,'Por 0,3 s seguidos.'],
 ['empeSai','Senta abaixo de (% FTP)',50,150,1,'Diferença para não ficar piscando.'],
 ['PROVA'],
 ['ts','Tempo acelerado (×)',1,100,1,'1 s real = N s de prova. 40 ≈ 30 km em 1:30, 100 km em ~5 min.'],
 ['dist','Distância da prova (km)',2,100,1,'Barra de progresso lá em cima.'],
 ['CENÁRIO'],
 ['vis','Velocidade visual do cenário',5,150,1,'Quantos pixels a estrada anda por m/s. Só visual.'],
 ['tam','Tamanho do ciclista',.1,1,.01,'Em relação à arte do cenário.'],
 ['faixa','Faixa do ciclista',0,1,.01,'0 = borda de trás da pista, 1 = borda da frente. Faixa de trás ≈ 0,25.'],
 ['larg','Largura da estrada',10,90,1,'Altura da pista na tela (os dois lados sempre aparecem).'],
 ['incl','Inclinação desenhada (×)',.3,2,.05,'1 = 6% ≈ 18°, 10% ≈ 30°, 12% ≈ 35°.'],
 ['dia','Ciclo do dia (min reais)',0,20,.5,'Dia → pôr do sol → noite → amanhecer. 0 = sempre dia.'],
 ['neblina','Neblina entre camadas',0,2,.1,'Névoa de profundidade nas montanhas.'],
 ['zoomV','Câmera afasta na velocidade',0,.6,.01,'Quanto a câmera abre quando está rápido.'],
 ['empurra','Empurrão da câmera',0,5,.1,'Acelerou: o ciclista avança na tela.'],
 ['tremor','Tremor da câmera',0,2,.05,'Tremor no sprint/força alta e acima de 55 km/h. 0 = desligado, 1 = o antigo (forte).'],
 ['vento','Linhas de vento',0,3,.1,'Riscos que passam acima de ~25 km/h.'],
 ['ITENS (valem ao reiniciar)'],
 ['aguaQ','Água: garrafas',0,10,1,'Quantas na largada. Tecla 1.'],
 ['aguaFad','Água: tira de fadiga',0,30,1,'Devolve isso do teto da barra, aos poucos.'],
 ['aguaSeg','Água: duração do gole (s)',.5,6,.5,'Em quanto tempo o efeito entra.'],
 ['isoQ','Isotônico: goles',0,10,1,'Quantos na largada. Tecla 2.'],
 ['isoFad','Isotônico: tira de fadiga',0,30,1,'Por gole.'],
 ['isoSta','Isotônico: devolve de stamina',0,60,1,'Por gole, enche a barra na hora (1,5 s).'],
 ['bananaQ','Banana: quantidade',0,10,1,'Tecla 3.'],
 ['bananaFad','Banana: tira de fadiga',0,30,1,''],
 ['bananaSta','Banana: devolve de stamina',0,100,1,'Enche a barra (em 1,5 s).'],
 ['gelQ','Gel: quantidade',0,10,1,'Tecla 4.'],
 ['gelFrac','Gel: tira da fadiga acumulada (%)',0,100,1,'Na hora. 2º gel rende 75%, 3º 55%, depois 40%.'],
 ['SOM'],
 ['som','Som ligado',0,1,1,'0 = mudo.'],
 ['musica','Volume da música',0,1,.05,''],
 ['efeitos','Volume dos efeitos',0,1,.05,'Pedalada, roda livre e itens.']];
// ---------------------------------------------------------------------------------------------
// Imagens: camadas da arte (todas 3344×941, alinhadas e emendáveis) + sprite pedalando (17 quadros 320×292)
const IW=3344,IH=941,FW=320,FH=292,NQ=17,PE=284; // PE = linha do pneu no quadro
const carrega=s=>{const i=new Image();i.src=encodeURI(s);return i};
// fundo em parallax (f = horizontal, nev = neblina, fv = quanto desce quando você sobe); estrada e morro da frente são desenhados em código
const CAM=[['02-montanhas-distantes',.06,.30,.03],['03-montanhas-intermediarias',.14,.20,.06],['04-colinas-distantes',.28,.10,.1],
 ['05-campo-e-arvores',.45,0,.16]].map(([n,f,nev,fv])=>({img:carrega('cenario-parallax/'+n+'.png'),f,nev,fv}));
const FRENTE={img:carrega('cenario-parallax/08-vegetacao-desfocada.png'),f:1.7};
const SPR=carrega('ciclista branco/sprite pedalando/pedalando_sheet.webp');
// em pé: 18 quadros 314×326 numa linha; pneu na linha 315; rodas na mesma escala do sentado (entre-eixos 180 × 179 px), +1,5 px para alinhar
const EMPE={img:carrega('ciclista branco/sprite em pe/em_pe_sheet.webp'),fw:314,fh:326,pe:315,dx:1.5};
const ITEM=[['agua','Digit1'],['iso','Digit2'],['banana','Digit3'],['gel','Digit4']].map(([id,k])=>({id,k,img:carrega('itens/'+id+'.webp')}));
const ok=i=>i.complete&&i.naturalWidth>0;
// ---------------------------------------------------------------------------------------------
// Terreno (igual ao protótipo): subida → topo → descida → vale
const DX=10;let GR_,HT,seg,semente;
function rnd(){semente=(semente*16807)%2147483647;return semente/2147483647}
const ri=(a,b)=>a+(b-a)*rnd();
function terrenoNovo(){semente=1+Math.floor(Math.random()*1e6);GR_=[0];HT=[0];HV=[0];seg={fase:-1,x0:0,len:1500,g:0,g0:0}}
function proxSeg(){const f=(seg.fase+1)%4,x0=seg.x0+seg.len,g0=seg.g;let len,g;
 if(f===0){len=ri(900,3500);g=ri(3,9.5)}
 else if(f===1){len=ri(150,700);g=ri(-.5,1.5)}
 else if(f===2){len=ri(900,3200);g=-ri(3,10)}
 else{len=ri(150,900);g=ri(-1,1)}
 if(rnd()<.2&&f===0){len=ri(400,900);g=ri(2,4)}
 seg={fase:f,x0,len,g,g0}}
function estende(ate){while(GR_.length*DX<ate){const x=GR_.length*DX;while(x>seg.x0+seg.len)proxSeg();
 const tr=Math.min(450,seg.len*.45),u=Math.min(1,(x-seg.x0)/tr),s=u*u*(3-2*u),g=seg.g0+(seg.g-seg.g0)*s;
 HT.push(HT[HT.length-1]+DX*(GR_[GR_.length-1]+g)/200);GR_.push(g)}}
function alt(x){if(x<=0)return 0;estende(x+DX*3);const i=Math.floor(x/DX),u=x/DX-i;return HT[i]+(HT[i+1]-HT[i])*u}
function rampa(x){if(x<=0)return 0;estende(x+DX*3);const i=Math.floor(x/DX),u=x/DX-i;return GR_[i]+(GR_[i+1]-GR_[i])*u}
// Altura DESENHADA (exagerada): mesma rampa do perfil, inclinação na tela vt(g): 6% ≈ 18°, 10% ≈ 30°, 12% ≈ 35° (teto 45°)
let HV=[0],HVi=null;
function vt(g){const a=Math.abs(g);return Math.sign(g)*Math.min(1,P.incl*(a<=6?.054*a:.325+.0625*(a-6)))}
function hv(x){if(x<=0)return 0;if(HVi!==P.incl){HV=[0];HVi=P.incl}estende(x+DX*3);
 while(HV.length<GR_.length){const i=HV.length;HV.push(HV[i-1]+vt((GR_[i-1]+GR_[i])/2)*DX)}
 const i=Math.floor(x/DX),u=x/DX-i;return HV[i]+(HV[i+1]-HV[i])*u}
// ---------------------------------------------------------------------------------------------
let S,FX,pausado=false;
function reiniciar(){terrenoNovo();S={t:0,x:0,v:0,pw:0,hold:false,holdT:0,mord:0,acum:0,teto:100,soma:0,pico:0,tw:9999,holdAnt:false,sprintAnt:false,
 zoom:1,kmhAnt:0,acc:0,camOff:0,roll:0,ang:0,quadro:0,fim:false,ganho:0,
 it:{agua:P.aguaQ,iso:P.isoQ,banana:P.bananaQ,gel:P.gelQ},efe:[],nGel:0,msg:null,spr:null,sprFeito:false,verdeIni:100,segT:0,ms:0,msV:0,empe:false,empeT:0,empeA:0};FX={vento:[],po:[],ventoAcum:0,poAcum:0}}
// ---------------------------------------------------------------------------------------------
const CRR=.004,CDA=.30,RHO=1.2,GRV=9.81,ETA=.97,KIN=6,FMAX=400;   // 27/11: antes a força usava v ≥ 2 m/s e a bike travava em 0 na subida
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function barra(){return Math.max(0,S.teto-S.mord-S.ms)}   // amarelo = teto (até o vermelho) − mordida (volta ao soltar) − gasto do sprint (volta devagar)
const B=()=>({pMax:700+40*P.nvSprint,fol:Math.pow(.92,P.nvFolego),folSpr:1-.02*P.nvFolego,rec:1+.06*P.nvRec,massa:75-P.nvEsc+8});
// fadiga por hora de PROVA em função de r = watts/FTP: abaixo do FTP r^curva; acima cresce rápido (punitivo)
function fadHora(r){return P.fadH*(r<=1?Math.pow(Math.max(0,r),P.fadExp):1+P.fadAcima*Math.pow(r-1,1.5))}
function alvoDe(h){const F=P.ftp,k=F/250;return F*.8+k*120*h}
function holdPara(pw){if(pw<=alvoDe(0))return 0;let a=0,b=12;for(let i=0;i<30;i++){const m=(a+b)/2;alvoDe(m)<pw?a=m:b=m}return a}
// sprint: decidido na largada dele pelo tamanho da barra (teto = verde + o que volta)
// sprintPlano(teto): teto = amarelo que havia quando o dedo encostou
function sprintPlano(teto){const bd=B(),F=P.ftp,c=clamp((teto-50)/50,0,1),q=clamp((teto-P.sprMin)/Math.max(1,50-P.sprMin),0,1);
 const fr=teto>=50?P.sprPicoMeio/100+(1-P.sprPicoMeio/100)*c:P.sprPicoMeio/100*(.65+.35*q);
 return{dur:P.sprMeio+(P.sprCheia-P.sprMeio)*c,pico:F+(bd.pMax-F)*fr,custo:P.sprCusto*teto/100*bd.folSpr}}
function passo(dt){
 const F=P.ftp,bd=B();
 S.t+=dt;
 // reapertou: o sprint tem que ser segurado de novo do zero (antes o tempo vinha dos watts e o "pisca" religava o sprint)
 if(S.hold&&!S.holdAnt){S.holdT=Math.min(holdPara(S.pw),P.sprintApos*.6);S.verdeIni=barra();S.segT=0}   // amarelo de antes da mordida
 if(S.hold){S.holdT+=dt;S.segT+=dt}else{S.holdT=0;S.segT=0;S.spr=null;S.sprFeito=false}   // segT = tempo segurando DESTE toque (o sprint exige sprintApos inteiro)
 S.holdAnt=S.hold;
 // 27/11: barra AMARELA (stamina) e VERMELHA (fadiga) coladas. O sprint gasta o amarelo (pode zerar; zerou, acabou o sprint);
 // parte do gasto vira fadiga; soltou, o amarelo volta até o vermelho. Só a fadiga no fim derruba (QUEBROU).
 if(S.hold&&!S.spr&&!S.sprFeito&&S.segT>P.sprintApos){
  if(S.verdeIni>=P.sprMin){S.spr=Object.assign(sprintPlano(S.verdeIni),{t:0});S.pico=0;S.mord=Math.max(0,S.teto-S.ms-S.verdeIni)}else S.sprFeito=true}   // a mordida volta: o amarelo na tela é o combustível do sprint
 const sprint=!!S.spr;S.sprintAnt=sprint;
 if(sprint){S.pw+=(S.spr.pico-S.pw)*Math.min(1,dt*10);S.pw=Math.min(S.pw,S.spr.pico)}
 else if(S.hold){const al=alvoDe(S.holdT);S.pw+=(al-S.pw)*Math.min(1,dt*10)}
 else S.pw*=Math.exp(-dt*Math.LN2/(S.pw>F?.6:3));
 // fora do sprint: teto de watts pelo verde (vazio = tetoVazio% do FTP)
 const b=barra(),tv=F*P.tetoVazio/100;
 if(!sprint){const tw=tv+(bd.pMax-tv)*Math.pow(clamp(b/100,0,1),1.3);S.tw+=(tw-S.tw)*Math.min(1,dt*6);S.pw=Math.min(S.pw,S.tw,bd.pMax)}
 else S.tw=S.pw;
 if(sprint)S.pico=Math.max(S.pico,S.pw);
 const r=S.pw/F,baixa=1-b/100,dur=1+P.dureza*baixa*baixa;
 if(sprint){const sp=S.spr,resta=Math.max(dt,sp.dur-sp.t),d=barra()*Math.min(1,dt/resta),cf=Math.min(d,sp.custo*Math.min(dt,resta)/sp.dur);
  S.teto-=cf;S.ms+=d-cf;S.msV=0;                               // o amarelo escorre até zerar no fim; o preço vira fadiga, o resto volta devagar (sprVolta)
  sp.t+=dt;if(sp.t>=sp.dur||barra()<.5){S.spr=null;S.sprFeito=true;S.tw=tv;S.pw=Math.min(S.pw,tv)}}   // zerou: corta na hora (sem rabo de watts)
 else if(S.hold){S.acum+=P.come*r*dur*dt;                          // respiração do toque (igual à do dono)
  const alvo=(P.toque+P.morde*Math.pow(Math.min(r,1.3),1.6))*dur+S.acum;
  S.mord=Math.min(S.teto-S.ms,S.mord+Math.max(0,alvo-S.mord)*Math.min(1,dt/P.tauIn))}
 else{S.acum=0;S.mord*=Math.exp(-dt*bd.rec/(P.volta*dur))}
 if(!sprint&&S.ms>0){if(!S.msV)S.msV=S.ms/Math.max(.1,P.sprVolta);S.ms=Math.max(0,S.ms-S.msV*bd.rec*dt)}   // volta linear do gasto do sprint
 if(S.hold&&!sprint&&b<3)S.teto-=P.vazio*bd.fol*dt;   // segurando com o verde vazio: o vermelho avança rápido até quebrar
 if(!sprint)S.teto-=fadHora(r)*bd.fol*dt*P.ts/3600;   // fadiga do tempo de PROVA (o sprint tem preço próprio)
 S.teto=Math.max(0,S.teto);
 // em pé: acima de empeLiga% do FTP por 0,3 s; senta abaixo de empeSai%
 const pc=r*100;S.empeT=pc>P.empeLiga?(S.empeT||0)+dt:0;
 if(!S.empe&&S.empeT>.3)S.empe=true;else if(S.empe&&pc<P.empeSai)S.empe=false;
 S.empeA=clamp((S.empeA||0)+(S.empe?dt:-dt)/.15,0,1);
 // itens: efeito aos poucos (fadiga volta para o teto; stamina enche a barra)
 S.efe=S.efe.filter(e=>{const k=Math.min(1,dt/e.seg);const qf=Math.min(e.fad,e.f0*k),qs=Math.min(e.sta,e.s0*k);

 ctx.fillStyle='#f5c518';ctx.beginPath();ctx.arc(bL+bw*pc,bY+6*u+1,13*u+2,0,7);ctx.fill();ctx.strokeStyle='#33404f';ctx.lineWidth=3*u;ctx.stroke();

 const fv=clamp(kmh/80,0,1);ctx.strokeStyle='#fff';ctx.beginPath();ctx.arc(gx,gy,gr,Math.PI*1.08,Math.PI*(1.08+.84*fv));ctx.stroke();
 const an=Math.PI*(1.08+.84*fv);ctx.lineWidth=4*u+1;ctx.beginPath();ctx.moveTo(gx,gy-4*u);ctx.lineTo(gx+Math.cos(an)*gr*.75,gy+Math.sin(an)*gr*.75);ctx.stroke();
 ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(gx,gy-4*u,6*u,0,7);ctx.fill();ctx.lineCap='butt';

 // média de watts e % do FTP (da média)

 const pw=86*u+10;pilula(mx+16*u,gy-42*u,pw,40*u+4);txt(fmt(media/F*100,0)+'%',mx+16*u+pw/2,gy-12*u,24*u,'#f5c518','center');
 // ── topo direito: rampa e elevação ganha
 const rp=rampa(S.x),tw=230*u+20,tx=W-m-tw;pilula(tx,m,tw,ph);
 montanha(tx+54*u,m+ph/2,40*u,'#fff');

 // ── perfil dos próximos 10 km

 const br=58*u+10,bh=18*u+4,ih=54*u+8,iw=ih*.8,ig=8*u,itFim=m+ITEM.length*(iw+ig)-ig;
 const x1=itFim+60*u,xMax=W-m-2*br-24*u,larg=Math.max(80,Math.min(820*u,xMax-x1)),byB=H-m-bh-10*u;
 raio(x1-22*u,byB+bh/2,40*u,'#f5c518');

 const pB=barra()/100;
 ctx.save();rr(ctx,x1,byB,larg,bh,bh/2);ctx.clip();
 ctx.fillStyle='#e8453c';ctx.fillRect(x1+larg*pB,byB,larg*(1-pB),bh);
 ctx.fillStyle=S.spr?'#ffe066':'#f5c518';ctx.fillRect(x1,byB,larg*pB,bh);
 ctx.fillStyle='rgba(255,255,255,.18)';ctx.fillRect(x1,byB,larg,bh*.35);ctx.restore();
 if(S.pico>0)txt('PICO '+fmt(S.pico,0)+' W',x1+larg,byB-8*u,15*u,'#fff','right',700);
 // botão de força
 const bX=W-m-br,bYr=H-m-br;botRaio={x:bX,y:bYr,r:br};

 if(S.t<4)txt('Toque ou segure em qualquer lugar da tela (ou Espaço)',W/2,H*.42,20*u,'#fff','center',700);

 botItens=[];
 ITEM.forEach((I,i)=>{const x=m+i*(iw+ig),y=byB+bh/2-ih/2,n=S.it[I.id],ativo=S.efe.some(e=>e.id===I.id);botItens.push({id:I.id,x,y,w:iw,h:ih});
  rr(ctx,x,y,iw,ih,12*u);ctx.fillStyle=ativo?'rgba(245,197,24,.55)':'rgba(28,38,52,.62)';ctx.fill();
  if(ok(I.img)){const im=I.img,k2=Math.min((iw-10*u)/im.width,(ih-10*u)/im.height);ctx.globalAlpha=n?1:.3;

  ctx.beginPath();ctx.arc(x+iw-4*u,y+6*u,11*u+3,0,7);ctx.fillStyle=n?'#f5c518':'#55606e';ctx.fill();
  txt(String(n),x+iw-4*u,y+11*u,15*u+2,'#1c2634','center',800,false)});
 if(S.msg&&S.t-S.msg.t<1.6){ctx.globalAlpha=clamp(1.6-(S.t-S.msg.t),0,1);ctx.font='italic 800 '+(22*u)+'px system-ui,sans-serif';const mw=ctx.measureText(S.msg.txt).width+36*u;pilula(W/2-mw/2,H*.5-26*u,mw,36*u,'rgba(20,30,44,.82)');txt(S.msg.txt,W/2,H*.5,22*u,'#8fe0ff','center');ctx.globalAlpha=1}

function perfil(u,m){
 const pw=Math.min(W*.3,440*u),ph=66*u+10,bh=18*u+4,px=W/2-pw/2,py=H-m-bh-10*u-26*u-ph;
 rr(ctx,px,py,pw,ph,14*u);ctx.fillStyle='rgba(28,38,52,.62)';ctx.fill();
 txt('próximos 10 km',px+14*u,py+19*u,14*u,'#e6ecf2','left',700);
 const x0=S.x-500,x1=x0+10000,n=80,ix=px+14*u,iw=pw-28*u,iy=py+26*u,ih=ph-36*u;
 let lo=Infinity,hi=-Infinity;const hs=[];for(let i=0;i<=n;i++){const h=alt(Math.max(0,x0+(x1-x0)*i/n));hs.push(h);lo=Math.min(lo,h);hi=Math.max(hi,h)}
 const esc=Math.max(hi-lo,60),Xp=i=>ix+iw*i/n,Yp=h=>iy+ih-(h-lo)/esc*ih;
 ctx.beginPath();ctx.moveTo(Xp(0),iy+ih);hs.forEach((h,i)=>ctx.lineTo(Xp(i),Yp(h)));ctx.lineTo(Xp(n),iy+ih);ctx.closePath();
 ctx.fillStyle='rgba(255,255,255,.14)';ctx.fill();
 ctx.beginPath();hs.forEach((h,i)=>i?ctx.lineTo(Xp(i),Yp(h)):ctx.moveTo(Xp(i),Yp(h)));ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=2*u+.5;ctx.stroke();
 const meta=P.dist*1000;if(meta>x0&&meta<x1){const fx=ix+iw*(meta-x0)/(x1-x0);ctx.fillStyle='rgba(255,255,255,.5)';ctx.fillRect(fx-1,iy,2,ih)}
 const cx=ix+iw*(S.x-x0)/(x1-x0),cy=Yp(alt(S.x));
 ctx.fillStyle='rgba(245,197,24,.55)';ctx.fillRect(ix,iy+ih-1,cx-ix,2*u+1);
 ctx.beginPath();ctx.arc(cx,cy,5*u+1.5,0,7);ctx.fillStyle='#f5c518';ctx.fill();ctx.strokeStyle='#1c2634';ctx.lineWidth=2*u;ctx.stroke()}

// recorde e chegada
function recorde(){try{return +localStorage.getItem('cenario_rec_'+P.dist)||0}catch(e){return 0}}
function chegada(){S.fim=true;const t=S.t*P.ts,r=recorde();let novo=!r||t<r;if(novo)try{localStorage.setItem('cenario_rec_'+P.dist,t)}catch(e){}
 abrePausa('CHEGADA',relogio(t)+(novo?' • novo recorde!':' • recorde '+relogio(r)))}

// Itens
const GEL_RENDE=[1,.75,.55,.4];
function usar(id){if(pausado||S.fim||!S.it[id]||S.efe.some(e=>e.id===id))return;S.it[id]--;let txtm='';
 if(id==='gel'){const k=GEL_RENDE[Math.min(S.nGel++,3)],q=(100-S.teto)*P.gelFrac/100*k;S.teto=Math.min(100,S.teto+q);txtm='GEL −'+fmt(q,0)+' FADIGA'+(k<1?' (rendeu '+Math.round(k*100)+'%)':'')}
 else{const f=id==='agua'?P.aguaFad:id==='iso'?P.isoFad:P.bananaFad,s=id==='agua'?0:id==='iso'?P.isoSta:P.bananaSta;
  S.efe.push({id,fad:f,sta:s,f0:f,s0:s,seg:id==='agua'?P.aguaSeg:1.5});
  txtm=(id==='agua'?'ÁGUA':id==='iso'?'ISOTÔNICO':'BANANA')+' −'+f+' FADIGA'+(s?' · +'+s+' STAMINA':'')}
 S.msg={t:S.t,txt:txtm};som('bonus');if(navigator.vibrate)try{navigator.vibrate(18)}catch(e){}}

// Som (Web Audio, liga no 1º toque): música, pedalada e roda livre em loop, "bonus" ao usar item
let AC=null,gMus,gSfx,BUF={},LP={};
function somLiga(){if(AC){if(AC.state==='suspended')AC.resume();return}
 try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return}
 gMus=AC.createGain();gSfx=AC.createGain();gMus.gain.value=0;gSfx.gain.value=0;gMus.connect(AC.destination);gSfx.connect(AC.destination);
 ['game','pedal','freewheel','bonus'].forEach(k=>fetch('sons/'+k+'.mp3').then(r=>r.arrayBuffer()).then(b=>new Promise((ok,no)=>AC.decodeAudioData(b,ok,no)))
  .then(d=>{BUF[k]=d;if(k!=='bonus'){const s=AC.createBufferSource();s.buffer=d;s.loop=true;const g=AC.createGain();g.gain.value=0;s.connect(g);g.connect(k==='game'?gMus:gSfx);s.start();LP[k]={s,g}}}).catch(()=>{}))}
function som(k){if(!AC||!BUF[k])return;const s=AC.createBufferSource();s.buffer=BUF[k];s.connect(gSfx);s.start()}
function somTick(){if(!AC)return;const t=AC.currentTime,kmh=S.v*3.6,on=P.som>.5,cor=!pausado&&!S.fim,
 ped=cor&&S.pw>=25?clamp(.3+kmh/45*.7,0,1):0,livre=cor&&S.pw<25&&kmh>3?clamp(.35+kmh/50*.65,0,1):0;
 gMus.gain.setTargetAtTime(on?P.musica*.5*(pausado?.4:1):0,t,.1);gSfx.gain.setTargetAtTime(on?P.efeitos:0,t,.08);
 if(LP.pedal){LP.pedal.g.gain.setTargetAtTime(ped*.85,t,.12);LP.pedal.s.playbackRate.setTargetAtTime(clamp(.75+kmh/40*.55,.7,1.5),t,.15)}
 if(LP.freewheel){LP.freewheel.g.gain.setTargetAtTime(livre*1.2,t,.12);LP.freewheel.s.playbackRate.setTargetAtTime(clamp(.8+kmh/50*.5,.7,1.4),t,.15)}
 if(LP.game)LP.game.g.gain.setTargetAtTime(1,t,.3)}
const pausaEl=document.getElementById('pausa');
function abrePausa(t='PAUSA',sub=''){pausado=true;document.getElementById('pTit').textContent=t;document.getElementById('pSub').textContent=sub;
 document.getElementById('continuar').hidden=S.fim;pausaEl.hidden=false;dedos.clear();teclado=false;atualizaHold()}
function fechaPausa(){pausaEl.hidden=true;pausado=false;ult=performance.now()}
const dedos=new Set();let teclado=false;
function atualizaHold(){const h=dedos.size>0||teclado;if(h&&!S.hold&&navigator.vibrate)try{navigator.vibrate(10)}catch(e){}S.hold=h}
cv.addEventListener('pointerdown',e=>{e.preventDefault();somLiga();const p=botPausa;
 if(e.clientX>=p.x&&e.clientX<=p.x+p.w&&e.clientY>=p.y&&e.clientY<=p.y+p.h){abrePausa();return}
 for(const b of botItens)if(e.clientX>=b.x&&e.clientX<=b.x+b.w&&e.clientY>=b.y&&e.clientY<=b.y+b.h){usar(b.id);return}
 dedos.add(e.pointerId);try{cv.setPointerCapture(e.pointerId)}catch(_){}atualizaHold()});
['pointerup','pointercancel','lostpointercapture'].forEach(n=>cv.addEventListener(n,e=>{dedos.delete(e.pointerId);atualizaHold()}));
addEventListener('keydown',e=>{somLiga();if(e.code==='Space'&&!pausado){e.preventDefault();teclado=true;atualizaHold()}
 for(const I of ITEM)if(e.code===I.k||e.code==='Numpad'+I.k.slice(5))usar(I.id);
 if(e.code==='KeyF')telaCheia();
 if(e.code==='Escape'||e.code==='KeyP'){pausado?(!S.fim&&fechaPausa()):abrePausa()}});
addEventListener('keyup',e=>{if(e.code==='Space'){teclado=false;atualizaHold()}});

 if(rot===undefined){const h=document.createElement('h3');h.textContent=k;box.appendChild(h);return}

 box.appendChild(d);const i=d.querySelector('input'),o=d.querySelector('output');i.value=P[k];o.textContent=fmt(+P[k],casas(st));

 if(!s){s=JSON.parse(localStorage.getItem('cenario_parallax4')||'null');if(s)delete s.sprCusto}   // 27/11 12h: sprint mais caro (50%)

  if(s)['ts','desg','cansa','wSprint','cheia','fadBat','sprintApos'].forEach(k=>delete s[k])}

['fullscreenchange','webkitfullscreenchange'].forEach(n=>document.addEventListener(n,()=>{btCheia.textContent=emCheia()?'SAIR DA TELA CHEIA':'TELA CHEIA';setTimeout(tam,50)}));

tam();reiniciar();montaPainel();
