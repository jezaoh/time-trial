<title>Barra que Respira</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Protótipo preto e branco: só riscos e bolinhas. Estrada = risco branco; fundo = riscos cinza (parallax); bolinha = ciclista. Acento amarelo só na barra. */
:root{--bg:#000;--fg:#f2f2f2;--dim:#8a8a8a;--acc:#f5c518;color-scheme:dark}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);overflow:hidden;
 font:14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
.bt{position:fixed;background:#111;color:var(--fg);border:1px solid #444;border-radius:8px;
 padding:8px 12px;font:600 13px system-ui,sans-serif;letter-spacing:.04em;cursor:pointer}
.bt:focus-visible{outline:2px solid var(--acc)}
#abrir{top:calc(10px + env(safe-area-inset-top,0px));right:calc(10px + env(safe-area-inset-right,0px))}
#reini{top:calc(10px + env(safe-area-inset-top,0px));right:calc(118px + env(safe-area-inset-right,0px))}
#painel{position:fixed;top:0;right:0;bottom:0;width:min(340px,92vw);background:#0b0b0bf2;border-left:1px solid #333;
 padding:calc(12px + env(safe-area-inset-top,0px)) calc(14px + env(safe-area-inset-right,0px)) 16px 14px;
 overflow-y:auto;box-sizing:border-box;display:flex;flex-direction:column;gap:12px}
#painel[hidden]{display:none}
#painel h2{margin:0;font-size:15px;letter-spacing:.06em}
#painel h3{margin:6px 0 0;font-size:12px;letter-spacing:.08em;color:var(--dim)}
#sl{display:flex;flex-direction:column;gap:12px}
.lin{display:grid;grid-template-columns:1fr auto;gap:2px 8px}
.lin label{font-weight:600}
.lin output{color:var(--acc)}
.lin input{grid-column:1/-1;width:100%;accent-color:var(--acc)}
.lin small{grid-column:1/-1;color:var(--dim);line-height:1.3}
.acoes{display:flex;gap:8px;flex-wrap:wrap}
.acoes .bt{position:static}
#texto{width:100%;box-sizing:border-box;background:#000;color:var(--fg);border:1px solid #333;border-radius:6px;font:12px ui-monospace,monospace;padding:6px}
#ver{color:var(--dim);font-size:11px}
</style>

<canvas id="cv"></canvas>
<button class="bt" id="reini" type="button">REINICIAR</button>
<button class="bt" id="abrir" type="button">AJUSTES</button>
<aside id="painel" hidden>
 <h2>AJUSTES</h2>
 <div id="sl"></div>
 <div class="acoes">
  <button class="bt" id="copiar" type="button">COPIAR NÚMEROS</button>
  <button class="bt" id="padrao" type="button">VOLTAR AO PADRÃO</button>
  <button class="bt" id="fechar" type="button">FECHAR</button>
 </div>
 <textarea id="texto" rows="4" readonly aria-label="Números atuais"></textarea>
 <div id="ver"></div>
</aside>

<script>
const VERSAO='26/11/2026 00:05';
// ---------------------------------------------------------------------------------------------
// Números ajustáveis
const PADRAO={ftp:208,toque:5,morde:12,come:6,tauIn:.06,volta:.1,desg:15,dureza:2,cansa:2.5,vazio:3,
 ts:63,tela:1600,zoomV:.2,exag:7,empurra:1.5,vento:1,perto:1};
const P=Object.assign({},PADRAO);
const SL=[
 ['BARRA'],
 ['ftp','FTP (W)',120,400,1,'Sua força de 1 hora. Tudo é medido em % dela.'],
 ['toque','Mordida do toque (%)',0,20,.5,'Pedaço que some na hora que o dedo encosta.'],
 ['morde','Mordida pela força (%)',0,40,.5,'Pedaço extra conforme os watts.'],
 ['come','Come segurando (%/s)',0,30,.5,'Enquanto segura, a barra continua sendo comida.'],
 ['tauIn','Velocidade da mordida (s)',.02,.4,.01,'Menor = some mais rápido.'],
 ['volta','Velocidade da volta (s)',.05,2,.05,'Menor = volta mais rápido quando solta.'],
 ['desg','Desgaste (%/min no FTP)',0,60,1,'O que não volta mais (hachurado). Em minutos reais.'],
 ['dureza','Dureza no final',0,6,.1,'Com a barra baixa a mordida cresce e a volta demora.'],
 ['cansa','Fadiga por stamina gasta (%)',0,20,.5,'Cada 100 de stamina mordida (no FTP) come isso do teto. Toque forte pesa mais.'],
 ['vazio','Castigo de segurar vazio (/s)',0,15,.5,'Segurando com a barra zerada, o teto cai isso por segundo.'],
 ['VELOCIDADE E CÂMERA'],
 ['ts','Tempo acelerado (×)',1,100,1,'Como no jogo: 1 s real = N s de prova. 48 = prova de 50 km.'],
 ['tela','Metros na tela',300,4000,50,'Câmera. Mais = mais longe, terreno grande.'],
 ['zoomV','Câmera afasta na velocidade',0,1.5,.05,'Quanto a câmera abre quando está rápido.'],
 ['exag','Exagero das subidas',1,10,.1,'Só visual: deixa as rampas mais em pé.'],
 ['empurra','Empurrão da câmera',0,5,.1,'Apertou: a bolinha avança na tela e a câmera alcança.'],
 ['vento','Linhas de vento',0,3,.1,'Riscos que passam acima de ~25 km/h.'],
 ['perto','Postes perto',0,3,.1,'Riscos em primeiro plano passando rápido.']];
// ---------------------------------------------------------------------------------------------
// Terreno em ondas longas: subida → topo arredondado → descida → vale, emendados suavemente (grade a cada 10 m)
const DX=10;let GR_,HT,seg,semente;
function rnd(){semente=(semente*16807)%2147483647;return semente/2147483647}
const ri=(a,b)=>a+(b-a)*rnd();
function terrenoNovo(){semente=1+Math.floor(Math.random()*1e6);GR_=[0];HT=[0];seg={fase:-1,x0:0,len:1500,g:0,g0:0}}
function proxSeg(){const f=(seg.fase+1)%4,x0=seg.x0+seg.len,g0=seg.g;let len,g;
 if(f===0){len=ri(900,3500);g=ri(3,9.5)}            // subida
 else if(f===1){len=ri(150,700);g=ri(-.5,1.5)}      // topo
 else if(f===2){len=ri(900,3200);g=-ri(3,10)}       // descida
 else{len=ri(150,900);g=ri(-1,1)}                   // vale
 if(rnd()<.2&&f===0){len=ri(400,900);g=ri(2,4)}     // às vezes uma ondinha
 seg={fase:f,x0,len,g,g0}}
function estende(ate){while(GR_.length*DX<ate){const x=GR_.length*DX;while(x>seg.x0+seg.len)proxSeg();
 const tr=Math.min(450,seg.len*.45),u=Math.min(1,(x-seg.x0)/tr),s=u*u*(3-2*u),g=seg.g0+(seg.g-seg.g0)*s;
 HT.push(HT[HT.length-1]+DX*(GR_[GR_.length-1]+g)/200);GR_.push(g)}}
function alt(x){if(x<=0)return 0;estende(x+DX*3);const i=Math.floor(x/DX),u=x/DX-i;return HT[i]+(HT[i+1]-HT[i])*u}
function rampa(x){if(x<=0)return 0;estende(x+DX*3);const i=Math.floor(x/DX),u=x/DX-i;return GR_[i]+(GR_[i+1]-GR_[i])*u}
// ---------------------------------------------------------------------------------------------
let S,FX;
function reiniciar(){terrenoNovo();S={t:0,x:0,v:0,pw:0,hold:false,holdT:0,mord:0,acum:0,teto:100,soma:0,
 camY:null,zoom:1,kmhAnt:0,acc:0,camOff:0};FX={vento:[],po:[],ventoAcum:0,poAcum:0}}
// ---------------------------------------------------------------------------------------------
// Passo: barra e watts em segundos reais; distância em tempo de prova (× ts), como no jogo
const M=83,CRR=.004,CDA=.30,RHO=1.2,GRV=9.81,ETA=.97,KIN=6;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function barra(){return Math.max(0,S.teto-S.mord)}
function passo(dt){
 S.t+=dt;if(S.hold)S.holdT+=dt;else S.holdT=0;
 const F=P.ftp,k=F/250;
 const alvoW=F*.8+k*(120*S.holdT+(S.holdT>2.5?500*(S.holdT-2.5)**1.5:0));
 if(S.hold&&S.pw<alvoW)S.pw+=(alvoW-S.pw)*Math.min(1,dt*10);
 else S.pw*=Math.exp(-dt*Math.LN2/(S.pw>F?.6:3));
 const b=barra(),pMax=F*4.6,tetoW=F*.75+(pMax-F*.75)*Math.pow(clamp(b/60,0,1),1.5);
 S.pw=Math.min(S.pw,tetoW);
 const r=S.pw/F,baixa=1-b/100,dur=1+P.dureza*baixa*baixa;
 if(S.hold){S.acum+=P.come*r*dur*dt;
  const alvo=(P.toque+P.morde*Math.pow(r,1.6))*dur+S.acum;
  const m0=S.mord;S.mord+=(alvo-S.mord)*Math.min(1,dt/P.tauIn);
  S.teto-=Math.max(0,S.mord-m0)*P.cansa/100*r*r*r;   // gastar stamina come fadiga
  if(b<3)S.teto-=P.vazio*dt}
 else{S.acum=0;S.mord*=Math.exp(-dt/(P.volta*dur))}
 S.teto=Math.max(0,S.teto-P.desg/60*Math.pow(Math.max(0,(r-.4)/.6),2)*dt);
 S.mord=clamp(S.mord,0,S.teto);
 // física (inércia acelerada como no jogo)
 const g=rampa(S.x)/100,sn=g/Math.sqrt(1+g*g),cs=1/Math.sqrt(1+g*g);
 for(let i=0;i<4;i++){const h=dt/4,v=S.v,
  a=(ETA*S.pw/Math.max(v,2)-M*GRV*(CRR*cs+sn)-.5*RHO*CDA*v*v)/M;
  S.v=clamp(v+a*h*KIN,0,30);S.x+=S.v*h*P.ts}
 S.soma+=S.pw*dt;
 const kmh=S.v*3.6;if(dt>0){S.acc+=((kmh-S.kmhAnt)/dt-S.acc)*Math.min(1,dt/.15)}S.kmhAnt=kmh;
}
// ---------------------------------------------------------------------------------------------
const cv=document.getElementById('cv'),ctx=cv.getContext('2d',{alpha:false});let W,H,DPR;
function tam(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',tam);
const fmt=(n,c=0)=>n.toLocaleString('pt-BR',{minimumFractionDigits:c,maximumFractionDigits:c});
function relogio(t){const s=Math.floor(t);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function txt(s,x,y,tf,cor,al='left',peso=600){ctx.font=peso+' '+tf+'px system-ui,-apple-system,Segoe UI,Roboto,sans-serif';ctx.fillStyle=cor;ctx.textAlign=al;ctx.fillText(s,x,y)}
const hash=n=>{const s=Math.sin(n*127.1)*43758.5453;return s-Math.floor(s)};
// camadas do fundo (só riscos cinza): f = quanto andam em relação à estrada
const morros=x=>90*Math.sin(x/700)+50*Math.sin(x/260+1)+25*Math.sin(x/97+2);
const serra=x=>{let y=0;for(const[a,p,o]of[[160,1100,0],[90,430,1.3],[40,170,2.1]])y+=a*Math.pow(1-Math.abs(Math.sin(x/p+o)),1.6);return y};
function camada(f,base,fn,cor,lw,u){ctx.strokeStyle=cor;ctx.lineWidth=lw;ctx.beginPath();
 const off=S.x*f/P.tela*W;for(let X=-4;X<=W+4;X+=4){const Y=base-fn((X+off)/u)*u;X<=-4?ctx.moveTo(X,Y):ctx.lineTo(X,Y)}ctx.stroke()}
function desenha(dt){
 const acc='#f5c518';ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
 const u=Math.min(W,H*1.78)/1000,kmh=S.v*3.6,F=P.ftp;
 // câmera
 S.zoom+=(1+P.zoomV*clamp((kmh-15)/45,0,1)-S.zoom)*Math.min(1,dt*2);
 const ppm=W/(P.tela*S.zoom);
 const alvoOff=clamp(S.acc*P.empurra*6*u,-W*.08,W*.1);S.camOff+=(alvoOff-S.camOff)*Math.min(1,dt/.35);
 const bx=W*.34+S.camOff;
 const yb=-alt(S.x)*P.exag*ppm;if(S.camY===null)S.camY=yb;S.camY+=(yb-S.camY)*Math.min(1,dt*5);
 let tremX=0,tremY=0;const tr=clamp((S.pw/F-1.4)/1.5,0,1)*3*u+clamp((kmh-55)/20,0,1)*2*u;
 if(tr>0){tremX=(Math.random()-.5)*tr;tremY=(Math.random()-.5)*tr}
 ctx.save();ctx.translate(tremX,tremY);
 // fundo: serra (lenta) e morros (média), presos levemente à câmera
 const sobe=(S.camY-yb)*.0;const cy0=-S.camY;
 camada(.12,H*.36+cy0*.04,serra,'#2e2e2e',1.5,u);
 camada(.3,H*.5+cy0*.1,morros,'#444',1.5,u);
 // estrada (o risco)
 const oy=H*.6-S.camY,sy=x=>-alt(x)*P.exag*ppm+oy,sx=x=>bx+(x-S.x)*ppm;
 const x0=S.x-(bx+10)/ppm,x1=S.x+(W-bx+10)/ppm;
 ctx.strokeStyle='#f2f2f2';ctx.lineWidth=Math.max(2,2.4*u);ctx.lineJoin='round';ctx.beginPath();
 const pm=Math.max(DX,3/ppm);for(let x=x0;x<=x1+pm;x+=pm){const X=sx(x),Y=sy(x);x===x0?ctx.moveTo(X,Y):ctx.lineTo(X,Y)}ctx.stroke();
 // bolinha (tamanho fixo na tela, como no exemplo: pequena num mundo grande)
 const rb=Math.max(5,H*.02),ang=Math.atan(rampa(S.x)/100*P.exag),
  cx=bx-Math.sin(ang)*rb,cy=sy(S.x)-Math.cos(ang)*rb-1;
 // poeira: bolinhas cinza saindo para trás em alta velocidade / descida
 const taxaPo=clamp((kmh-30)/25,0,1)*40;FX.poAcum+=taxaPo*dt;
 while(FX.poAcum>=1){FX.poAcum--;FX.po.push({x:cx-rb*.6,y:sy(S.x)-1,vx:-(60+Math.random()*80)*u,vy:-(20+Math.random()*50)*u,t:0,vida:.4+Math.random()*.4})}
 ctx.fillStyle='#9a9a9a';FX.po=FX.po.filter(p=>{p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=120*u*dt;const a=1-p.t/p.vida;
  if(a<=0)return false;ctx.globalAlpha=a*.7;ctx.beginPath();ctx.arc(p.x,p.y,1.6*u+.6,0,7);ctx.fill();return true});ctx.globalAlpha=1;
 ctx.fillStyle='#f2f2f2';ctx.beginPath();ctx.arc(cx,cy,rb,0,7);ctx.fill();
 const giro=S.x/3;ctx.strokeStyle='#000';ctx.lineWidth=Math.max(1.2,rb*.16);ctx.beginPath();
 ctx.moveTo(cx-Math.cos(giro)*rb*.7,cy-Math.sin(giro)*rb*.7);ctx.lineTo(cx+Math.cos(giro)*rb*.7,cy+Math.sin(giro)*rb*.7);ctx.stroke();
 // primeiro plano: risco cinza embaixo + postes passando rápido (f > 1)
 if(P.perto>0){const f=1.9,off=S.x*f/P.tela*W,base=H*.95;
  const fg=X=>base-(18*Math.sin((X+off)/(230*u))+10*Math.sin((X+off)/(90*u)+1))*u;
  ctx.strokeStyle='#5a5a5a';ctx.lineWidth=2*u+1;ctx.beginPath();for(let X=-4;X<=W+4;X+=6){X<=-4?ctx.moveTo(X,fg(X)):ctx.lineTo(X,fg(X))}ctx.stroke();
  const passo=W/(3+3*P.perto),i0=Math.floor(off/passo);ctx.lineWidth=3*u+1;ctx.beginPath();
  for(let i=i0;i<i0+Math.ceil(W/passo)+2;i++){if(hash(i)>.55)continue;const X=i*passo-off+hash(i+7)*passo*.6,h=(30+hash(i+3)*50)*u;
   ctx.moveTo(X,fg(X));ctx.lineTo(X,fg(X)-h)}ctx.stroke()}
 // linhas de vento
 const vel=S.v*P.ts*ppm;
 FX.ventoAcum+=clamp((kmh-25)/25,0,2)*14*P.vento*dt;
 while(FX.ventoAcum>=1){FX.ventoAcum--;FX.vento.push({x:W+20,y:H*(.12+Math.random()*.7),l:(30+kmh*1.6)*u*(.6+Math.random()*.8),k:1.6+Math.random()*1.4,a:.12+Math.random()*.25})}
 ctx.strokeStyle='#f2f2f2';ctx.lineWidth=1;FX.vento=FX.vento.filter(w=>{w.x-=(vel*w.k+250*u)*dt;if(w.x+w.l<0)return false;
  ctx.globalAlpha=w.a;ctx.beginPath();ctx.moveTo(w.x,w.y);ctx.lineTo(w.x+w.l,w.y);ctx.stroke();return true});ctx.globalAlpha=1;
 ctx.restore();
 // visão de túnel com a barra baixa / fadiga
 const tunel=.8*Math.pow(clamp(1-barra()/100,0,1),2.2)+.35*Math.pow(1-S.teto/100,2);
 if(tunel>.01){const gr=ctx.createRadialGradient(W/2,H*.55,Math.min(W,H)*.25,W/2,H*.55,Math.max(W,H)*.75);
  gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,0,0,'+clamp(tunel,0,.92)+')');ctx.fillStyle=gr;ctx.fillRect(0,0,W,H)}
 // ---- HUD ----
 const m=24*u+8,top=m+30*u,media=S.t>0?S.soma/S.t:0;
 txt(relogio(S.t*P.ts),m,top,30*u,'#f2f2f2');
 txt(fmt(S.x/1000,1)+' km',m,top+34*u,20*u,'#8a8a8a');
 txt(fmt(kmh,0),W*.5-10*u,top+6*u,64*u,'#f2f2f2','right',700);
 txt('km/h',W*.5-4*u,top+6*u,20*u,'#8a8a8a');
 txt(fmt(S.pw,0)+' W',W*.5+80*u,top-14*u,26*u,'#f2f2f2','left',700);
 txt(fmt(S.pw/F*100,0)+'% FTP',W*.5+80*u,top+14*u,18*u,acc);
 txt('MÉDIA '+fmt(media,0)+' W · FTP '+F,W*.5+80*u,top+38*u,15*u,'#8a8a8a');
 const rp=rampa(S.x);txt((rp>=0?'+':'')+fmt(rp,1)+'%',W-m,top+64*u,30*u,'#f2f2f2','right',700);
 txt(fmt(alt(S.x),0)+' m',W-m,top+92*u,16*u,'#8a8a8a','right');
 const bw=Math.min(W*.5,700*u),bh=Math.max(14,18*u),bxL=(W-bw)/2,byT=H-m-bh-10*u;
 ctx.fillStyle='#1a1a1a';ctx.fillRect(bxL,byT,bw,bh);
 const pTeto=S.teto/100,pBarra=barra()/100;
 ctx.save();ctx.beginPath();ctx.rect(bxL+bw*pTeto,byT,bw*(1-pTeto),bh);ctx.clip();
 ctx.strokeStyle='#333';ctx.lineWidth=2;ctx.beginPath();for(let x=bxL-bh;x<bxL+bw;x+=7){ctx.moveTo(x,byT+bh);ctx.lineTo(x+bh,byT)}ctx.stroke();ctx.restore();
 ctx.fillStyle=acc+'55';ctx.fillRect(bxL+bw*pBarra,byT,bw*(pTeto-pBarra),bh);
 ctx.fillStyle=acc;ctx.fillRect(bxL,byT,bw*pBarra,bh);
 ctx.strokeStyle='#444';ctx.lineWidth=1;ctx.strokeRect(bxL+.5,byT+.5,bw-1,bh-1);
 txt('STAMINA '+fmt(barra(),0),bxL,byT-8*u,15*u,'#f2f2f2');
 txt('teto '+fmt(S.teto,0),bxL+bw,byT-8*u,15*u,'#8a8a8a','right',500);
 const br=52*u+10,bX=W-m-br,bY=H-m-br;
 ctx.beginPath();ctx.arc(bX,bY,br,0,7);ctx.fillStyle=S.hold?acc:'#111';ctx.fill();
 ctx.lineWidth=2;ctx.strokeStyle=S.hold?acc:'#555';ctx.stroke();
 txt('⚡',bX,bY+br*.3,br*.85,S.hold?'#000':'#f2f2f2','center');
 if(S.t<4)txt('Toque ou segure em qualquer lugar da tela (ou Espaço)',W/2,H*.3,18*u,'#8a8a8a','center',500);
 txt('protótipo '+VERSAO,m,H-m,12*u,'#555','left',500);
}
// ---------------------------------------------------------------------------------------------
const dedos=new Set();let teclado=false;
function atualizaHold(){const h=dedos.size>0||teclado;if(h&&!S.hold&&navigator.vibrate)try{navigator.vibrate(10)}catch(e){}S.hold=h}
cv.addEventListener('pointerdown',e=>{e.preventDefault();dedos.add(e.pointerId);try{cv.setPointerCapture(e.pointerId)}catch(_){}atualizaHold()});
['pointerup','pointercancel','lostpointercapture'].forEach(n=>cv.addEventListener(n,e=>{dedos.delete(e.pointerId);atualizaHold()}));
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();teclado=true;atualizaHold()}});
addEventListener('keyup',e=>{if(e.code==='Space'){teclado=false;atualizaHold()}});
cv.addEventListener('contextmenu',e=>e.preventDefault());
// ---------------------------------------------------------------------------------------------
const painel=document.getElementById('painel'),slBox=document.getElementById('sl'),texto=document.getElementById('texto');
const casas=st=>st<1?(st<.1?2:1):0;
function montaPainel(){slBox.innerHTML='';SL.forEach(([k,rot,mi,ma,st,aj])=>{
 if(rot===undefined){const h=document.createElement('h3');h.textContent=k;slBox.appendChild(h);return}
 const d=document.createElement('div');d.className='lin';
 d.innerHTML=`<label for="s_${k}">${rot}</label><output></output><input type="range" id="s_${k}" min="${mi}" max="${ma}" step="${st}"><small>${aj}</small>`;
 slBox.appendChild(d);const i=d.querySelector('input'),o=d.querySelector('output');i.value=P[k];o.textContent=fmt(+P[k],casas(st));
 i.addEventListener('input',()=>{P[k]=+i.value;o.textContent=fmt(P[k],casas(st));numeros();salva()})});numeros()}
function numeros(){texto.value='BARRA '+VERSAO+'\n'+SL.filter(s=>s.length>1).map(([k,rot])=>rot+': '+P[k]).join('\n')}
function salva(){try{localStorage.setItem('barra_respira2',JSON.stringify(P))}catch(e){}}
try{const s=JSON.parse(localStorage.getItem('barra_respira2')||'null');if(s)Object.assign(P,s)}catch(e){}
document.getElementById('abrir').onclick=()=>{painel.hidden=false};
document.getElementById('fechar').onclick=()=>{painel.hidden=true};
