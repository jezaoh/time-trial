<title>Barra que Respira</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Protótipo preto e branco: um risco (a estrada), uma bolinha (o ciclista), os dados e a barra. Um acento amarelo só na barra. */
:root{--bg:#000;--fg:#f2f2f2;--dim:#8a8a8a;--faint:#2a2a2a;--acc:#f5c518;--bite:#f5c51855;color-scheme:dark}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);overflow:hidden;
 font:14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
.bt{position:fixed;background:#111;color:var(--fg);border:1px solid #444;border-radius:8px;
 padding:8px 12px;font:600 13px system-ui,sans-serif;letter-spacing:.04em;cursor:pointer}
.bt:focus-visible{outline:2px solid var(--acc)}
#abrir{top:calc(10px + env(safe-area-inset-top,0px));right:calc(10px + env(safe-area-inset-right,0px))}
#reini{top:calc(10px + env(safe-area-inset-top,0px));right:calc(118px + env(safe-area-inset-right,0px))}
#painel{position:fixed;top:0;right:0;bottom:0;width:min(340px,92vw);background:#0b0b0bf2;border-left:1px solid #333;
 padding:calc(12px + env(safe-area-inset-top,0px)) calc(14px + env(safe-area-inset-right,0px)) 16px 14px;
 overflow-y:auto;box-sizing:border-box;display:flex;flex-direction:column;gap:12px}
#painel[hidden]{display:none}
#painel h2{margin:0;font-size:15px;letter-spacing:.06em}
.lin{display:grid;grid-template-columns:1fr auto;gap:2px 8px}
.lin label{font-weight:600}
.lin output{color:var(--acc)}
.lin input{grid-column:1/-1;width:100%;accent-color:var(--acc)}
.lin small{grid-column:1/-1;color:var(--dim);line-height:1.3}
.acoes{display:flex;gap:8px;flex-wrap:wrap}
.acoes .bt{position:static}
#texto{width:100%;box-sizing:border-box;background:#000;color:var(--fg);border:1px solid #333;border-radius:6px;font:12px ui-monospace,monospace;padding:6px}
#ver{color:var(--dim);font-size:11px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<canvas id="cv"></canvas>
<button class="bt" id="reini" type="button">REINICIAR</button>
<button class="bt" id="abrir" type="button">AJUSTES</button>
<aside id="painel" hidden>
 <h2>AJUSTES DA BARRA</h2>
 <div id="sl"></div>
 <div class="acoes">
  <button class="bt" id="copiar" type="button">COPIAR NÚMEROS</button>
  <button class="bt" id="padrao" type="button">VOLTAR AO PADRÃO</button>
  <button class="bt" id="fechar" type="button">FECHAR</button>
 </div>
 <textarea id="texto" rows="4" readonly aria-label="Números atuais"></textarea>
 <div id="ver"></div>
</aside>

<script>
const VERSAO='25/11/2026 22:31';
// ---------------------------------------------------------------------------------------------
// Números ajustáveis (os deslizantes mexem aqui)
const PADRAO={ftp:208,toque:5,morde:12,come:6,tauIn:.06,volta:.4,desg:15,dureza:2,tela:45,zoomV:.4,exag:3};
const P=Object.assign({},PADRAO);
const SL=[
 ['ftp','FTP (W)',120,400,1,'Sua força de 1 hora. Tudo é medido em % dela.'],
 ['toque','Mordida do toque (%)',0,20,.5,'Pedaço que some na hora que o dedo encosta, mesmo num toque fraco.'],
 ['morde','Mordida pela força (%)',0,40,.5,'Pedaço extra conforme os watts: toque forte come mais.'],
 ['come','Come segurando (%/s)',0,30,.5,'Enquanto segura, a barra continua sendo comida.'],
 ['tauIn','Velocidade da mordida (s)',.02,.4,.01,'Menor = some mais rápido.'],
 ['volta','Velocidade da volta (s)',.1,2,.05,'Menor = volta mais rápido quando solta.'],
 ['desg','Desgaste (%/min no FTP)',0,60,1,'O que não volta mais (faixa escura). É a fadiga que ganha no fim.'],
 ['dureza','Dureza no final',0,6,.1,'Com a barra baixa a mordida cresce e a volta demora.'],
 ['tela','Metros na tela',20,120,1,'Câmera. Menos metros = mais perto e mais sensação de velocidade.'],
 ['zoomV','Câmera afasta na velocidade',0,1.5,.05,'Quanto a câmera abre quando você está rápido.'],
 ['exag','Exagero das subidas',1,8,.1,'Só visual: deixa as rampas mais em pé na tela.']];
// ---------------------------------------------------------------------------------------------
// Terreno: pontos a cada 250 m com inclinação sorteada, curva suave entre eles
const L=250;let G,Hh,semente;
function rnd(){semente=(semente*16807)%2147483647;return semente/2147483647}
function terrenoNovo(){semente=1+Math.floor(Math.random()*1e6);G=[0,0];Hh=[0,0]}
function garante(i){while(G.length<=i+1){const g0=G[G.length-1];
 let g=g0+(rnd()-.5)*7;if(rnd()<.15)g=(rnd()-.4)*16;g=Math.max(-9,Math.min(9,g));
 Hh.push(Hh[Hh.length-1]+L*(g0+g)/200);G.push(g)}}
function alt(x){if(x<0)return 0;const i=Math.floor(x/L);garante(i);const u=x/L-i,
 m0=G[i]/100*L,m1=G[i+1]/100*L,u2=u*u,u3=u2*u;
 return(2*u3-3*u2+1)*Hh[i]+(u3-2*u2+u)*m0+(-2*u3+3*u2)*Hh[i+1]+(u3-u2)*m1}
const rampa=x=>(alt(x+1)-alt(x-1))/2*100;   // %
// ---------------------------------------------------------------------------------------------
// Estado
let S;
function reiniciar(){terrenoNovo();S={t:0,x:0,v:0,pw:0,hold:false,holdT:0,mord:0,acum:0,teto:100,soma:0,camY:null,zoom:1}}
// ---------------------------------------------------------------------------------------------
// Passo do jogo
const M=83,CRR=.004,CDA=.32,RHO=1.2,GR=9.81,ETA=.97;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function barra(){return Math.max(0,S.teto-S.mord)}
function passo(dt){
 S.t+=dt;if(S.hold)S.holdT+=dt;else S.holdT=0;
 const F=P.ftp,k=F/250;
 // watts (igual ao jogo: "o dedo é a força")
 const alvoW=F*.8+k*(120*S.holdT+(S.holdT>2.5?500*(S.holdT-2.5)**1.5:0));
 if(S.hold&&S.pw<alvoW)S.pw+=(alvoW-S.pw)*Math.min(1,dt*10);
 else S.pw*=Math.exp(-dt*Math.LN2/(S.pw>F?.6:3));
 // teto de watts pela barra (barra vazia = 75% FTP)
 const b=barra(),pMax=F*4.6,tetoW=F*.75+(pMax-F*.75)*Math.pow(clamp(b/60,0,1),1.5);
 S.pw=Math.min(S.pw,tetoW);
 // ---- BARRA QUE RESPIRA ----
 const r=S.pw/F,baixa=1-b/100,dur=1+P.dureza*baixa*baixa;
 if(S.hold){S.acum+=P.come*r*dur*dt;
  const alvo=(P.toque+P.morde*Math.pow(r,1.6))*dur+S.acum;
  S.mord+=(alvo-S.mord)*Math.min(1,dt/P.tauIn)}
 else{S.acum=0;S.mord*=Math.exp(-dt/(P.volta*dur))}
 S.teto=Math.max(0,S.teto-P.desg/60*Math.pow(Math.max(0,(r-.4)/.6),2)*dt);
 S.mord=clamp(S.mord,0,S.teto);
 // física
 const g=rampa(S.x)/100,sn=g/Math.sqrt(1+g*g),cs=1/Math.sqrt(1+g*g);
 for(let i=0;i<4;i++){const h=dt/4,v=S.v,
  a=(ETA*S.pw/Math.max(v,1)-M*GR*(CRR*cs+sn)-.5*RHO*CDA*v*v)/M;
  S.v=Math.max(0,v+a*h);S.x+=S.v*h}
 S.soma+=S.pw*dt;
}
// ---------------------------------------------------------------------------------------------
// Desenho
const cv=document.getElementById('cv'),ctx=cv.getContext('2d',{alpha:false});let W,H,DPR;
function tam(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',tam);
const fmt=(n,c=0)=>n.toLocaleString('pt-BR',{minimumFractionDigits:c,maximumFractionDigits:c});
function relogio(t){const s=Math.floor(t);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function txt(s,x,y,tamF,cor,al='left',peso=600){ctx.font=peso+' '+tamF+'px system-ui,-apple-system,Segoe UI,Roboto,sans-serif';ctx.fillStyle=cor;ctx.textAlign=al;ctx.fillText(s,x,y)}
function desenha(){
 const cs=getComputedStyle(document.documentElement),acc=cs.getPropertyValue('--acc').trim()||'#f5c518';
 ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
 const u=Math.min(W,H*1.78)/1000;   // unidade de tela (HUD)
 // câmera
 const kmh=S.v*3.6;S.zoom+=(1+P.zoomV*clamp((kmh-15)/45,0,1)-S.zoom)*.04;
 const ppm=W/(P.tela*S.zoom),bx=W*.3,yb=-alt(S.x)*P.exag*ppm;
 if(S.camY===null)S.camY=yb;S.camY+=(yb-S.camY)*.08;
 const oy=H*.62-S.camY,sy=x=>-alt(x)*P.exag*ppm+oy,sx=x=>bx+(x-S.x)*ppm;
 const x0=S.x-bx/ppm-2,x1=S.x+(W-bx)/ppm+2;
 // marcas (5 m) para sentir a velocidade
 ctx.strokeStyle='rgba(255,255,255,.28)';ctx.lineWidth=1;ctx.beginPath();
 for(let m=Math.ceil(x0/5)*5;m<x1;m+=5){const X=sx(m),Y=sy(m),l=m%50===0?14:6;ctx.moveTo(X,Y+3);ctx.lineTo(X,Y+3+l)}ctx.stroke();
 // o risco (estrada)
 ctx.strokeStyle='#f2f2f2';ctx.lineWidth=Math.max(2,2.5*u);ctx.lineJoin='round';ctx.beginPath();
 const passoM=Math.max(.5,3/ppm);for(let x=x0;x<=x1;x+=passoM){const X=sx(x),Y=sy(x);x===x0?ctx.moveTo(X,Y):ctx.lineTo(X,Y)}ctx.stroke();
 // a bolinha (raio 0,6 m), com um raio girando
 const rb=.6*ppm,ang=Math.atan(rampa(S.x)/100*P.exag),cx=bx-Math.sin(ang)*rb,cy=sy(S.x)-Math.cos(ang)*rb-ctx.lineWidth/2;
 ctx.fillStyle='#f2f2f2';ctx.beginPath();ctx.arc(cx,cy,rb,0,7);ctx.fill();
 const giro=S.x/.6;ctx.strokeStyle='#000';ctx.lineWidth=Math.max(1.5,rb*.12);ctx.beginPath();
 ctx.moveTo(cx-Math.cos(giro)*rb*.7,cy-Math.sin(giro)*rb*.7);ctx.lineTo(cx+Math.cos(giro)*rb*.7,cy+Math.sin(giro)*rb*.7);ctx.stroke();
 // ---- HUD ----
 const m=24*u+8,top=m+30*u,F=P.ftp,media=S.t>0?S.soma/S.t:0;
 txt(relogio(S.t),m,top,30*u,'#f2f2f2');
 txt(fmt(S.x/1000,2)+' km',m,top+34*u,20*u,'#8a8a8a');
 txt(fmt(kmh,0),W*.5-10*u,top+6*u,64*u,'#f2f2f2','right',700);
 txt('km/h',W*.5-4*u,top+6*u,20*u,'#8a8a8a','left');
 txt(fmt(S.pw,0)+' W',W*.5+80*u,top-14*u,26*u,'#f2f2f2','left',700);
 txt(fmt(S.pw/F*100,0)+'% FTP',W*.5+80*u,top+14*u,18*u,acc,'left');
 txt('MÉDIA '+fmt(media,0)+' W · FTP '+F,W*.5+80*u,top+38*u,15*u,'#8a8a8a','left');
 const rp=rampa(S.x);txt((rp>=0?'+':'')+fmt(rp,1)+'%',W-m,top+64*u,30*u,'#f2f2f2','right',700);
 txt(fmt(alt(S.x),0)+' m',W-m,top+92*u,16*u,'#8a8a8a','right');
 // barra
 const bw=Math.min(W*.5,520*u*1.4),bh=Math.max(14,18*u),bxL=(W-bw)/2,byT=H-m-bh-10*u;
 ctx.fillStyle='#1a1a1a';ctx.fillRect(bxL,byT,bw,bh);
 const pTeto=S.teto/100,pBarra=barra()/100;
 // desgaste (o que não volta): hachurado escuro à direita
 ctx.save();ctx.beginPath();ctx.rect(bxL+bw*pTeto,byT,bw*(1-pTeto),bh);ctx.clip();
 ctx.strokeStyle='#333';ctx.lineWidth=2;ctx.beginPath();for(let x=bxL-bh;x<bxL+bw;x+=7){ctx.moveTo(x,byT+bh);ctx.lineTo(x+bh,byT)}ctx.stroke();ctx.restore();
 // mordida (vai e volta)
 ctx.fillStyle=acc+'55';ctx.fillRect(bxL+bw*pBarra,byT,bw*(pTeto-pBarra),bh);
 ctx.fillStyle=acc;ctx.fillRect(bxL,byT,bw*pBarra,bh);
 ctx.strokeStyle='#444';ctx.lineWidth=1;ctx.strokeRect(bxL+.5,byT+.5,bw-1,bh-1);
 txt('STAMINA '+fmt(barra(),0),bxL,byT-8*u,15*u,'#f2f2f2');
 txt('mordida '+fmt(S.mord,0)+' · teto '+fmt(S.teto,0),bxL+bw,byT-8*u,15*u,'#8a8a8a','right',500);
 // botão (visual: toque em qualquer lugar da tela)
 const br=52*u+10,bX=W-m-br,bY=H-m-br;
 ctx.beginPath();ctx.arc(bX,bY,br,0,7);ctx.fillStyle=S.hold?acc:'#111';ctx.fill();
 ctx.lineWidth=2;ctx.strokeStyle=S.hold?acc:'#555';ctx.stroke();
 txt('⚡',bX,bY+br*.3,br*.85,S.hold?'#000':'#f2f2f2','center');
 if(S.t<4)txt('Toque ou segure em qualquer lugar da tela (ou Espaço)',W/2,H*.3,18*u,'#8a8a8a','center',500);
 txt('protótipo '+VERSAO,m,H-m,12*u,'#555','left',500);
}
// ---------------------------------------------------------------------------------------------
// Controle: dedo em qualquer lugar do canvas
const dedos=new Set();let teclado=false;
function atualizaHold(){const h=dedos.size>0||teclado;if(h&&!S.hold&&navigator.vibrate)try{navigator.vibrate(10)}catch(e){}S.hold=h}
cv.addEventListener('pointerdown',e=>{e.preventDefault();dedos.add(e.pointerId);try{cv.setPointerCapture(e.pointerId)}catch(_){}atualizaHold()});
['pointerup','pointercancel','lostpointercapture'].forEach(n=>cv.addEventListener(n,e=>{dedos.delete(e.pointerId);atualizaHold()}));
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();teclado=true;atualizaHold()}});
addEventListener('keyup',e=>{if(e.code==='Space'){teclado=false;atualizaHold()}});
cv.addEventListener('contextmenu',e=>e.preventDefault());
// ---------------------------------------------------------------------------------------------
// Painel de ajustes
const painel=document.getElementById('painel'),slBox=document.getElementById('sl'),texto=document.getElementById('texto');
function montaPainel(){slBox.innerHTML='';SL.forEach(([k,rot,mi,ma,st,aj])=>{const d=document.createElement('div');d.className='lin';
 d.innerHTML=`<label for="s_${k}">${rot}</label><output id="o_${k}"></output><input type="range" id="s_${k}" min="${mi}" max="${ma}" step="${st}"><small>${aj}</small>`;
 slBox.appendChild(d);const i=d.querySelector('input'),o=d.querySelector('output');i.value=P[k];o.textContent=fmt(+P[k],st<1?(st<.1?2:1):0);
 i.addEventListener('input',()=>{P[k]=+i.value;o.textContent=fmt(P[k],st<1?(st<.1?2:1):0);numeros();salva()})});slBox.style.display='flex';slBox.style.flexDirection='column';slBox.style.gap='12px';numeros()}
function numeros(){texto.value='BARRA '+VERSAO+'\n'+SL.map(([k,rot])=>rot+': '+P[k]).join('\n')}
function salva(){try{localStorage.setItem('barra_respira',JSON.stringify(P))}catch(e){}}
try{const s=JSON.parse(localStorage.getItem('barra_respira')||'null');if(s)Object.assign(P,s)}catch(e){}
document.getElementById('abrir').onclick=()=>{painel.hidden=false};
document.getElementById('fechar').onclick=()=>{painel.hidden=true};
document.getElementById('reini').onclick=e=>{e.currentTarget.blur();reiniciar()};
document.getElementById('padrao').onclick=()=>{Object.assign(P,PADRAO);salva();montaPainel()};
document.getElementById('copiar').onclick=()=>{numeros();const b=document.getElementById('copiar');
 const ok=()=>{b.textContent='COPIADO';setTimeout(()=>b.textContent='COPIAR NÚMEROS',1500)};
 try{navigator.clipboard.writeText(texto.value).then(ok,()=>{texto.select()})}catch(e){texto.select()}};
document.getElementById('ver').textContent='Versão '+VERSAO;
// ---------------------------------------------------------------------------------------------
tam();reiniciar();montaPainel();
let ult=performance.now();
function loop(t){const dt=Math.min(.05,(t-ult)/1000);ult=t;passo(dt);desenha();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script>
